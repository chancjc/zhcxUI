<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物业管理系统 - 退租管理</title>
<style>
/* ============================================================
   Design tokens — copied from existing PMS design system
   (Element Plus based) so this module matches visually.
   ============================================================ */
:root {
  --primary: #409eff;
  --primary-light-3: #79bbff;
  --primary-light-5: #a0cfff;
  --primary-light-7: #c6e2ff;
  --primary-light-8: #d9ecff;
  --primary-light-9: #ecf5ff;
  --primary-dark-2: #337ecc;

  --success: #67c23a;
  --success-light-9: #f0f9eb;
  --warning: #e6a23c;
  --warning-light-9: #fdf6ec;
  --danger: #f56c6c;
  --danger-light-9: #fef0f0;
  --info: #909399;
  --info-light-9: #f4f4f5;

  --link-blue: #00a1fe;

  --text-primary: #303133;
  --text-regular: #606266;
  --text-secondary: #909399;
  --text-placeholder: #a8abb2;

  --border-darker: #cdd0d6;
  --border-dark: #d4d7de;
  --border-base: #dcdfe6;
  --border-light: #e4e7ed;
  --border-lighter: #ebeef5;
  --border-extra-light: #f2f6fc;

  --bg-page: #f5f7f9;
  --bg-card: #ffffff;

  --sidebar-bg: #001529;
  --sidebar-bg-light: #0f2438;
  --sidebar-text: #bfcbd9;
  --sidebar-text-active: #ffffff;
  --sidebar-width: 210px;

  --topbar-height: 50px;
  --tagsview-height: 38px;

  --radius: 4px;
  --radius-lg: 8px;

  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue',
               'PingFang SC', 'Microsoft YaHei', 'Source Han Sans CN', sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); text-decoration: none; cursor: pointer; }
a:hover { color: var(--primary-dark-2); }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* ---------- App shell ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar {
  width: var(--sidebar-width); flex-shrink: 0; background: var(--sidebar-bg);
  display: flex; flex-direction: column; overflow-y: auto;
}
.sidebar-logo {
  height: var(--topbar-height); flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 16px; color: #fff; font-size: 15px; font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,.06); white-space: nowrap; overflow: hidden;
}
.sidebar-logo .mark {
  width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary), #7ab8ff);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff;
}
.nav { padding: 6px 0; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 0 18px; height: 42px;
  color: var(--sidebar-text); font-size: 13px; cursor: pointer; white-space: nowrap; user-select: none;
}
.nav-item:hover { color: #fff; background: rgba(255,255,255,.04); }
.nav-item.active { color: #fff; background: var(--primary); }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; }
.nav-item .lbl { flex: 1; }
.nav-item .chev { font-size: 11px; transition: transform .15s; opacity: .7; }
.nav-item.open .chev { transform: rotate(90deg); }
.nav-children { overflow: hidden; }
.nav-children.collapsed { display: none; }
.nav-sub {
  display: flex; align-items: center; padding: 0 18px 0 44px; height: 38px;
  color: var(--sidebar-text); font-size: 13px; cursor: pointer; white-space: nowrap;
}
.nav-sub:hover { color: #fff; background: rgba(255,255,255,.04); }
.nav-sub.active { color: #fff; background: rgba(64,158,255,.18); border-right: 2px solid var(--primary); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }

.topbar {
  height: var(--topbar-height); flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--border-lighter);
  display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
}
.topbar-left { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-regular); }
.topbar-left .hamb { font-size: 16px; color: var(--text-regular); cursor: pointer; }
.crumb-sep { color: var(--text-placeholder); }
.crumb-cur { color: var(--text-primary); font-weight: 500; }
.topbar-right { display: flex; align-items: center; gap: 16px; color: var(--text-regular); font-size: 15px; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#5ad0e0,#3aa0c8);
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600;
}
.user-name { font-size: 13px; color: var(--text-regular); }

.tagsbar {
  height: var(--tagsview-height); flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--border-lighter);
  display: flex; align-items: center; gap: 6px; padding: 0 10px; overflow-x: auto;
}
.tag-item {
  display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 12px;
  font-size: 12px; color: var(--text-regular); background: #fff; border: 1px solid var(--border-light);
  border-radius: 3px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.tag-item.active { color: var(--primary); border-color: var(--primary-light-5); background: var(--primary-light-9); }
.tag-item .x { font-size: 13px; color: var(--text-placeholder); line-height: 1; padding: 1px; }
.tag-item .x:hover { color: var(--danger); }

.content { flex: 1; overflow-y: auto; padding: 16px; }
.page { display: none; }
.page.active { display: block; }

/* ---------- Cards / filter bar ---------- */
.card { background: #fff; border: 1px solid var(--border-lighter); border-radius: var(--radius-lg); padding: 16px 18px; }
.filter-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.field { display: flex; align-items: center; gap: 8px; }
.field label { font-size: 13px; color: var(--text-regular); white-space: nowrap; }
.tabs-inline { display: flex; gap: 26px; border-bottom: 1px solid var(--border-lighter); margin-bottom: 16px; }
.tabs-inline .t { padding: 0 2px 10px; font-size: 14px; color: var(--text-regular); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs-inline .t.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

input[type=text], input[type=number], input[type=date], select, textarea {
  height: 32px; border: 1px solid var(--border-base); border-radius: var(--radius);
  padding: 0 11px; font-size: 13px; outline: none; background: #fff; color: var(--text-regular);
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
textarea { padding: 8px 11px; resize: none; height: auto; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--text-placeholder); }
input[disabled], select[disabled], .input-readonly {
  background: var(--border-extra-light); color: var(--text-secondary); cursor: not-allowed;
}

.btn {
  height: 32px; padding: 0 15px; border-radius: var(--radius); font-size: 13px; border: 1px solid var(--border-base);
  background: #fff; color: var(--text-regular); display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark-2); border-color: var(--primary-dark-2); color: #fff; }
.btn-success { background: var(--success); border-color: var(--success); color: #fff; }
.btn-success:hover { opacity: .9; color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; color: #fff; }
.btn[disabled] { background: var(--border-extra-light) !important; border-color: var(--border-light) !important;
  color: var(--text-placeholder) !important; cursor: not-allowed; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.link-btn { color: var(--link-blue); font-size: 13px; cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--danger); }
.link-btn.muted { color: var(--text-placeholder); cursor: not-allowed; }

/* ---------- Table ---------- */
table.gtab { width: 100%; border-collapse: collapse; font-size: 13px; }
table.gtab th {
  text-align: left; padding: 10px 12px; background: #fafbfc; color: var(--text-regular); font-weight: 500;
  border-bottom: 1px solid var(--border-lighter); white-space: nowrap;
}
table.gtab td { padding: 11px 12px; border-bottom: 1px solid var(--border-lighter); color: var(--text-regular); white-space: nowrap; }
table.gtab tr:hover td { background: var(--primary-light-9); }
.act-links { display: inline-flex; gap: 12px; }
.pagebar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--text-regular); }
.page-num { min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px; background: #f4f4f5; cursor: pointer; }
.page-num.cur { background: var(--primary); color: #fff; }

/* ---------- Tags ---------- */
.tag { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 3px; font-size: 12px; line-height: 20px; }
.tag-green { background: var(--success-light-9); color: var(--success); }
.tag-orange { background: var(--warning-light-9); color: var(--warning); }
.tag-blue { background: var(--primary-light-9); color: var(--link-blue); }
.tag-gray { background: var(--info-light-9); color: var(--text-secondary); }
.tag-red { background: var(--danger-light-9); color: var(--danger); }

/* ---------- Modal ---------- */
.mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2000; display: none;
  align-items: flex-start; justify-content: center; padding: 60px 20px; overflow: auto;
}
.mask.show { display: flex; }
.dialog { width: 460px; max-width: 100%; background: #fff; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.2);
  display: flex; flex-direction: column; max-height: calc(100vh - 100px); }
.dialog.w-wide { width: 900px; }
.dialog.w-mid { width: 640px; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px;
  border-bottom: 1px solid var(--border-lighter); flex-shrink: 0; }
.dialog-head .t { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.dialog-head .x { cursor: pointer; font-size: 17px; color: var(--text-placeholder); }
.dialog-head .x:hover { color: var(--text-regular); }
.dialog-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px;
  border-top: 1px solid var(--border-lighter); flex-shrink: 0; }

.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
.fitem { display: flex; flex-direction: column; gap: 6px; }
.fitem label { font-size: 13px; color: var(--text-regular); }
.fitem label .req { color: var(--danger); margin-right: 2px; }
.fitem input, .fitem select, .fitem textarea { width: 100%; }
.radio-row { display: flex; gap: 22px; height: 32px; align-items: center; }
.radio-opt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-regular); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.radio-opt input { accent-color: var(--primary); }

.upload-box {
  width: 100px; height: 100px; border: 1px dashed var(--border-dark); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; color: var(--text-placeholder);
  font-size: 22px; cursor: pointer; flex-shrink: 0; background: #fafafa;
}
.upload-box:hover { border-color: var(--primary); color: var(--primary); }
.upload-box.done { border-style: solid; border-color: var(--success); color: var(--success); font-size: 13px; flex-direction: column; gap: 4px; }

.warn-banner {
  background: var(--warning-light-9); border: 1px solid #f6e6c0; color: var(--warning);
  border-radius: 6px; padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
}
.section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin: 4px 0 10px; display: flex; align-items: center; justify-content: space-between; }
.sum-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; color: var(--text-regular); }
.sum-row .amt { color: var(--text-primary); font-weight: 500; }
.sum-row.total { border-top: 1px solid var(--border-lighter); margin-top: 8px; padding-top: 10px; font-size: 14px; }
.sum-row.total .lbl { font-weight: 600; color: var(--text-primary); }
.sum-row.total .amt { font-size: 17px; font-weight: 700; }
.amt-pos { color: var(--success); }
.amt-neg { color: var(--danger); }

.deduct-table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; }
.deduct-table th { text-align: left; font-size: 12px; color: var(--text-secondary); font-weight: 400; padding: 6px 8px; }
.deduct-table td { padding: 5px 8px; }
.deduct-table input, .deduct-table select { width: 100%; height: 30px; }

.tree-line { font-size: 13px; color: var(--text-regular); padding: 2px 0 2px 14px; position: relative; }
.tree-line .amt { float: right; }
.tree-root { font-size: 14px; color: var(--text-primary); font-weight: 600; margin-bottom: 4px; }
.tree-root .amt { float: right; font-size: 18px; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; row-gap: 18px; column-gap: 40px; }
.info-item .k { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.info-item .v { font-size: 13px; color: var(--text-primary); }
.info-item .v.link { color: var(--link-blue); cursor: pointer; }
.info-item .v.link:hover { text-decoration: underline; }
.info-item .thumb { width: 46px; height: 46px; border: 1px solid var(--border-light); border-radius: 4px;
  background: #f5f6f7 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23c0c4cc" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg>') center/22px no-repeat; }

/* ---------- Bill detail pages ---------- */
.bd-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.bd-title { font-size: 20px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
.bd-meta { font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
.bd-flex { display: flex; gap: 32px; align-items: flex-start; }
.bd-main { flex: 1; min-width: 0; }
.bd-side { width: 300px; flex-shrink: 0; background: #fafbfc; border: 1px solid var(--border-lighter); border-radius: 6px; padding: 16px 18px; }
.bd-side .side-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }
.bd-side .side-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-regular); padding: 6px 0; }
.bd-side .side-row.total { border-top: 1px solid var(--border-light); margin-top: 6px; padding-top: 10px; font-weight: 600; color: var(--text-primary); }
.bd-summary-bar { display: flex; background: #fafbfc; border: 1px solid var(--border-lighter); border-radius: 6px; margin-bottom: 24px; }
.bd-summary-bar .cell { flex: 1; text-align: center; padding: 16px 0; }
.bd-summary-bar .cell + .cell { border-left: 1px solid var(--border-lighter); }
.bd-summary-bar .cell .k { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.bd-summary-bar .cell .v { font-size: 20px; font-weight: 700; color: var(--link-blue); }

hr.div { border: none; border-top: 1px solid var(--border-lighter); margin: 14px 0; }

.toast-wrap { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 8px; }
.toast { background: rgba(30,30,32,.9); color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 5px; box-shadow: 0 6px 18px rgba(0,0,0,.2); opacity: 0; transform: translateY(-6px); transition: all .2s; }
.toast.show { opacity: 1; transform: translateY(0); }

/* ---------- Print voucher ---------- */
.voucher-head { text-align: center; margin-bottom: 6px; }
.voucher-head .co { font-size: 19px; font-weight: 700; color: var(--text-primary); }
.voucher-head .sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.voucher-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-regular); margin: 16px 0 4px; }
.voucher-meta .l1 span { margin-right: 26px; }
.voucher-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.voucher-table th, .voucher-table td { border: 1px solid var(--border-light); padding: 9px 12px; text-align: left; }
.voucher-table th { background: #fafbfc; font-weight: 500; color: var(--text-regular); }
.voucher-sum { display: flex; flex-wrap: wrap; gap: 22px; font-size: 13px; color: var(--text-regular); margin: 4px 0 14px; }
.voucher-sum b { color: var(--text-primary); }
.voucher-notice { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 12px; }

.empty-hint { text-align: center; color: var(--text-placeholder); font-size: 13px; padding: 60px 0; }
</style>
</head>
<body>

<div class="app">
  <!-- ============ Sidebar ============ -->
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="mark">物</span>物业管理系统-test</div>
    <nav class="nav" id="navRoot"></nav>
  </aside>

  <!-- ============ Main ============ -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="hamb">≡</span>
        <span id="crumb"></span>
      </div>
      <div class="topbar-right">
        <span>⛶</span><span>🔍</span><span>Tr</span><span>文</span><span>🔔</span>
        <div class="avatar">陈</div>
        <span class="user-name">陈寄尘</span>
      </div>
    </div>

    <div class="tagsbar" id="tagsBar"></div>

    <div class="content">
      <!-- ---------------- Page 1: 合同列表 ---------------- -->
      <section class="page" id="page-contract">
        <div class="tabs-inline">
          <div class="t active">全部</div>
          <div class="t">即将到期(18)</div>
          <div class="t">已到期</div>
        </div>
        <div class="card">
          <div class="filter-bar">
            <div class="field"><label>合同编号</label><input type="text" placeholder="请输入" style="width:150px"></div>
            <div class="field"><label>资产类型</label>
              <select style="width:140px"><option>请选择资产</option><option>公寓</option><option>商铺</option><option>车位</option></select>
            </div>
            <div class="field"><label>资产编号</label><input type="text" placeholder="请输入" style="width:120px"></div>
            <div class="field"><label>租户</label><input type="text" placeholder="请输入租户名称或手机号" style="width:180px"></div>
            <div class="field"><label>合同状态</label>
              <select style="width:130px"><option>请选择</option><option>生效中</option><option>退租中</option><option>已退租</option><option>已作废</option></select>
            </div>
            <div class="field"><label>起止日期</label><input type="text" placeholder="开始日期 - 结束日期" style="width:200px"></div>
            <button class="btn btn-primary">🔍 搜索</button>
            <button class="btn">↻ 重置</button>
            <button class="btn btn-primary" onclick="toast('演示原型未实现新增合同')">＋ 新增合同</button>
          </div>
          <div style="overflow-x:auto">
          <table class="gtab">
            <thead><tr>
              <th>合同编号</th><th>合同名称</th><th>资产类型</th><th>区域</th><th>资产编号</th><th>关联租户</th>
              <th>合同起止日期</th><th>合同状态</th><th>租金(元)</th><th>押金</th><th>物业费(元)</th><th>操作</th>
            </tr></thead>
            <tbody id="contractTbody"></tbody>
          </table>
          </div>
          <div class="pagebar">
            <span>共 <span id="contractCount"></span> 条</span>
            <span class="page-num cur">1</span><span class="page-num">2</span><span class="page-num">3</span>
          </div>
        </div>
      </section>

      <!-- ---------------- Page 2: 退租管理列表 ---------------- -->
      <section class="page" id="page-retirelist">
        <div class="card">
          <div class="filter-bar">
            <div class="field"><label>合同编号</label><input type="text" placeholder="请输入" style="width:150px"></div>
            <div class="field"><label>租户名称</label><select style="width:150px"><option>请选择</option></select></div>
            <div class="field"><label>状态</label>
              <select style="width:130px"><option>请选择</option><option>待审核</option><option>待退款</option><option>已退款</option><option>已关闭</option></select>
            </div>
            <div class="field"><label>时间</label><input type="text" placeholder="开始日期 - 结束日期" style="width:200px"></div>
            <button class="btn btn-primary">🔍 搜索</button>
            <button class="btn">↻ 重置</button>
            <button class="btn btn-success" onclick="toast('导出成功（演示）')">⬇ 导出</button>
          </div>
          <div style="overflow-x:auto">
          <table class="gtab">
            <thead><tr>
              <th>退租单号</th><th>合同编号</th><th>租户名称</th><th>资产类型</th><th>资产编号</th>

function openPage(key, label){

function closeTab(key, evt){
  if (evt) evt.stopPropagation();

  openTabs = openTabs.filter(k => k !== key);

  renderTabs(); renderPages(); updateNavActive(); updateCrumb();
}
function renderTabs(){
  const bar = document.getElementById('tagsBar');

    const closable = k !== 'contract';

  }).join('');
}
function switchTab(k){ curPage = k; renderTabs(); renderPages(); updateNavActive(); updateCrumb(); }
function renderPages(){

  if (curPage === 'retiredetail') renderRetireDetail();
  if (curPage.startsWith('bill:')) renderBillDetail(curPage);
}
function updateCrumb(){
  const parts = pageCrumb[curPage] || (dynamicTabs[curPage] && dynamicTabs[curPage].crumb) || ['首页'];

}

      actions = `<span class="link-btn danger" onclick="cancelRetire(${idx})">撤销退租</span>`;
    } else if (c.status === '待生效') {
      actions = `<span class="act-links">
        <span class="link-btn" onclick="toast('演示原型未实现合同变更')">合同变更</span>
        <span class="link-btn danger" onclick="voidContract(${idx})">作废</span>
      </span>`;
    } else {
      actions = `<span style="color:var(--text-placeholder)">--</span>`;
    }
    return `<tr>
      <td><a onclick="toast('演示原型未实现合同详情跳转')">${c.no}</a></td>
      <td>${c.name}</td>
      <td><span class="tag tag-blue">${c.kind}</span></td>

      <td>${c.deposit}</td>
      <td>${c.pm}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
}
function voidContract(idx){
  const c = contracts[idx];
  openConfirm('提示', `确认作废合同 ${c.no} 吗？作废后不可恢复。`, ()=>{
    c.status = '已作废';
    renderContractTable();
    toast('合同已作废');
  });
}
function cancelRetire(idx){
  const c = contracts[idx];
  openConfirm('撤销退租', '撤销退租后，关联水电账单及抄表记录将自动作废，合同将恢复为生效中，是否继续？', ()=>{
    c.status = '生效中';
    c.isRetiring = false;
    // void the associated retire record + its linked utility bill / meter record
    const r = retires.find(r => r.ht === c.no && (r.status === '待审核'));

    renderContractTable();
    toast('已撤销退租，关联水电账单及抄表记录已作废');
  });
}

/* ============================================================
   确认结算 modal
   ============================================================ */
function openSettleModal(no){
  curSettleNo = no;
  renderSettleBody();
  showModal('modalSettle');
}
function computeSettleTotals(r){
  const deduct = r.deductions.filter(d=>d.kind==='扣减').reduce((a,d)=>a+(parseFloat(d.amount)||0),0);
  const add = r.deductions.filter(d=>d.kind==='增加').reduce((a,d)=>a+(parseFloat(d.amount)||0),0);
  const refund = (r.depositPaid||0) - deduct + add;
  return { deduct, add, refund };
}
function renderSettleBody(){
  const r = findRetire(curSettleNo);
  const { deduct, add, refund } = computeSettleTotals(r);
  const allBills = r.bills || [];
  const unpaid = allBills.filter(b => b.status === '待缴费');
  const hasUnpaid = unpaid.length > 0;

  let html = '';
  if (hasUnpaid) {
    html += `<div class="warn-banner">⚠ 存在${unpaid.length}笔未缴清账单，请先处理后再提交结算</div>`;
    html += `<table class="gtab" style="margin-bottom:18px"><thead><tr><th>账单编号</th><th>账单类型</th><th>应缴金额</th><th>操作</th></tr></thead><tbody>`;
    unpaid.forEach((b) => {
      html += `<tr>
        <td><a onclick="openBillDetail('${b.type}','${b.no}','${r.no}')">${b.no}</a></td>
        <td>${b.type}</td>
        <td>¥${fmt2(b.amount)}</td>
        <td><span class="act-links">
          <span class="link-btn" onclick="toast('已打开账单编辑弹窗（演示）')">编辑</span>
          <span class="link-btn" onclick="markBillPaidByNo('${b.no}')">标记已缴</span>
          <span class="link-btn danger" onclick="voidBillByNo('${b.no}')">作废</span>
        </span></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }

  html += `<div class="section-title">押金缴纳详情</div>
    <div style="display:flex;gap:36px;margin-bottom:18px">
      <div>押金应缴：<b>${moneyPlain(r.depositShould)}</b></div>
      <div>押金实缴：<b>${moneyPlain(r.depositPaid)}</b></div>
    </div>`;

  html += `<div class="section-title">抵扣明细 <span class="link-btn" onclick="addDeductRow()">＋ 添加抵扣项</span></div>`;
  html += `<table class="deduct-table"><thead><tr><th style="width:110px">收支类型</th><th>抵扣项目</th><th style="width:140px">抵扣金额(元)</th><th>说明</th><th style="width:40px"></th></tr></thead><tbody>`;
  r.deductions.forEach((d, i) => {
    html += `<tr>
      <td><select onchange="updateDeduct(${i},'kind',this.value)">
            <option value="扣减" ${d.kind==='扣减'?'selected':''}>扣减</option>
            <option value="增加" ${d.kind==='增加'?'selected':''}>增加</option>
          </select></td>
      <td><input type="text" value="${d.item}" onchange="updateDeduct(${i},'item',this.value)"></td>
      <td><input type="number" value="${d.amount}" onchange="updateDeduct(${i},'amount',this.value)"></td>
      <td><input type="text" value="${d.note||''}" onchange="updateDeduct(${i},'note',this.value)"></td>
      <td><span class="link-btn danger" onclick="removeDeduct(${i})">删除</span></td>
    </tr>`;
  });
  html += `</tbody></table>`;

  html += `<hr class="div">
    <div class="sum-row"><span>押金实缴</span><span class="amt">${moneyPlain(r.depositPaid)}</span></div>
    <div class="sum-row"><span>扣减项合计</span><span class="amt amt-neg">-¥${fmt2(deduct)}</span></div>
    <div class="sum-row"><span>增加项合计</span><span class="amt amt-pos">+¥${fmt2(add)}</span></div>
    <div class="sum-row total"><span class="lbl">应退金额</span><span class="amt ${refund>=0?'amt-pos':'amt-neg'}">${money(refund)}</span></div>`;

  document.getElementById('settleBody').innerHTML = html;
  const btn = document.getElementById('settleSubmitBtn');
  btn.disabled = hasUnpaid;
}
function findBillGlobal(billNo){
  for (const r of retires) {
    const b = (r.bills || []).find(x => x.no === billNo);
    if (b) return { retire: r, bill: b };
  }
  return null;
}
function refreshAfterBillChange(){
  if (document.getElementById('modalSettle').classList.contains('show')) renderSettleBody();
  if (curPage.startsWith('bill:')) renderBillDetail(curPage);
  if (curPage === 'retirelist') renderRetireTable();
}
function markBillPaidByNo(billNo){
  const found = findBillGlobal(billNo);
  if (!found) { toast('未找到该账单'); return; }
  found.bill.status = '已缴费';
  if (found.bill.type === '押金账单') found.retire.depositPaid = found.retire.depositShould;
  toast('已标记为已缴');
  refreshAfterBillChange();
}
function voidBillByNo(billNo){
  const found = findBillGlobal(billNo);
  if (!found) { toast('未找到该账单'); return; }
  openConfirm('提示', '确认作废该账单吗？', ()=>{
    found.bill.status = '已作废';
    toast('账单已作废');
    refreshAfterBillChange();
  });
}
function addDeductRow(){
  const r = findRetire(curSettleNo);
  r.deductions.push({ kind:'扣减', item:'', amount:0, note:'', auto:false });
  renderSettleBody();
}
function removeDeduct(i){
  const r = findRetire(curSettleNo);
  r.deductions.splice(i,1);
  renderSettleBody();
}
function updateDeduct(i, field, val){
  const r = findRetire(curSettleNo);
  r.deductions[i][field] = field==='amount' ? (parseFloat(val)||0) : val;
  renderSettleBody();
}
function submitSettle(){
  const r = findRetire(curSettleNo);
  const stillUnpaid = (r.bills || []).some(b => b.status === '待缴费');
  if (stillUnpaid) { toast('存在未缴清账单，请先处理'); return; }
  const { refund } = computeSettleTotals(r);
  r.refundAmount = refund;
  r.settled = true;
  r.status = '待退款';
  closeModal('modalSettle');
  renderRetireTable();
  toast('结算已提交，退租单状态变更为待退款');
}

function submitRefund(){
  const r = findRetire(curRefundNo);
  const amt = parseFloat(document.getElementById('refundAmountInput').value);
  const box = document.getElementById('refundVoucherBox');
  if (!box.classList.contains('done')) { toast('请上传退款凭证照片'); return; }
  r.refundAmount = amt;
  r.refundDate = document.getElementById('refundDateInput').value;
  r.refundNote = document.getElementById('refundNoteInput').value;
  r.refundVoucher = true;
  r.status = '已退款';
  closeModal('modalRefund');
  renderRetireTable();
  toast('退款已完成');
}

  closeModal('modalSettle');

/* ============================================================

   ============================================================ */
function openPrintPreview(no){
  const r = findRetire(no);
  const { deduct, add } = computeSettleTotals(r);
  const refund = r.refundAmount != null ? r.refundAmount : ((r.depositPaid||0) - deduct + add);
  const dedRows = r.deductions.map(d => `<tr>
      <td>${d.kind}</td><td>${d.item}</td>
      <td>${d.kind==='扣减'?'-':'+'}¥${fmt2(d.amount)}</td><td>${d.note||'--'}</td>
    </tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--text-placeholder)">暂无抵扣明细</td></tr>`;
  const voucherNo = 'VC' + r.asset + r.date.replace(/-/g,'') + String(1000+ (r.no.length*7 % 900)).slice(-6);

  document.getElementById('printBody').innerHTML = `
    <div class="voucher-head">
      <div class="co">中山横栏镇金岛物业管理中心</div>
      <div class="sub">退租结算凭证</div>
    </div>
    <div class="voucher-meta">
      <div class="l1"><span>姓名：${r.tenant}</span><span>联系电话：${r.phone}</span></div>
      <div>凭证号：${voucherNo}</div>
    </div>
    <div class="voucher-meta">
      <div class="l1"><span>资产编号：${r.asset}</span><span>退租单号：${r.no}</span></div>
      <div>退租日期：${r.date}</div>
    </div>
    <table class="voucher-table">
      <thead><tr><th>收支类型</th><th>项目名称</th><th>金额</th><th>备注</th></tr></thead>
      <tbody>${dedRows}</tbody>
    </table>
    <div class="voucher-sum">
      <div>押金应缴：<b>${moneyPlain(r.depositShould)}</b></div>
      <div>押金实缴：<b>${moneyPlain(r.depositPaid)}</b></div>
      <div>扣减项合计：<b class="amt-neg">-¥${fmt2(deduct)}</b></div>
      <div>增加项合计：<b class="amt-pos">+¥${fmt2(add)}</b></div>
      <div>应退金额：<b class="${refund>=0?'amt-pos':'amt-neg'}">${money(refund)}</b></div>
    </div>
    <div class="voucher-notice">本收据不作为报销凭证，妥善保管，遗失不补。（白-存根 红-记账 蓝-留底 黄-客户）</div>
    <div class="fitem"><label>备注</label><textarea rows="3" placeholder="请输入备注信息"></textarea></div>
  `;
  showModal('modalPrint');
}
