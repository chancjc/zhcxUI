<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物业管理系统 - 资产管理</title>
<style>
:root {
  --primary: #409eff;
  --primary-light-3: #79bbff;
  --primary-light-5: #a0cfff;
  --primary-light-7: #c6e2ff;
  --primary-light-8: #d9ecff;
  --primary-light-9: #ecf5ff;
  --primary-dark-2: #337ecc;

  --success: #67c23a;
  --success-light-9: #f0f9eb;
  --warning: #e6a23c;
  --warning-light-9: #fdf6ec;
  --danger: #f56c6c;
  --danger-light-9: #fef0f0;
  --info: #909399;
  --info-light-9: #f4f4f5;

  --link-blue: #00a1fe;

  --text-primary: #303133;
  --text-regular: #606266;
  --text-secondary: #909399;
  --text-placeholder: #a8abb2;

  --border-darker: #cdd0d6;
  --border-dark: #d4d7de;
  --border-base: #dcdfe6;
  --border-light: #e4e7ed;
  --border-lighter: #ebeef5;
  --border-extra-light: #f2f6fc;

  --bg-page: #f5f7f9;
  --bg-card: #ffffff;

  --sidebar-bg: #001529;
  --sidebar-bg-light: #0f2438;
  --sidebar-text: #bfcbd9;
  --sidebar-text-active: #ffffff;
  --sidebar-width: 210px;

  --topbar-height: 50px;
  --tagsview-height: 38px;

  --radius: 4px;
  --radius-lg: 8px;

  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue',
               'PingFang SC', 'Microsoft YaHei', 'Source Han Sans CN', sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); text-decoration: none; cursor: pointer; }
a:hover { color: var(--primary-dark-2); }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar {
  width: var(--sidebar-width); flex-shrink: 0; background: var(--sidebar-bg);
  display: flex; flex-direction: column; overflow-y: auto;
}
.sidebar-logo {
  height: var(--topbar-height); flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 16px; color: #fff; font-size: 15px; font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,.06); white-space: nowrap; overflow: hidden;
}
.sidebar-logo .mark {
  width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary), #7ab8ff);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff;
}
.nav { padding: 6px 0; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 0 18px; height: 42px;
  color: var(--sidebar-text); font-size: 13px; cursor: pointer; white-space: nowrap; user-select: none;
}
.nav-item:hover { color: #fff; background: rgba(255,255,255,.04); }
.nav-item.active { color: #fff; background: var(--primary); }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; }
.nav-item .lbl { flex: 1; }
.nav-item .chev { font-size: 11px; transition: transform .15s; opacity: .7; }
.nav-item.open .chev { transform: rotate(90deg); }
.nav-children { overflow: hidden; }
.nav-children.collapsed { display: none; }
.nav-sub {
  display: flex; align-items: center; padding: 0 18px 0 44px; height: 38px;
  color: var(--sidebar-text); font-size: 13px; cursor: pointer; white-space: nowrap;
}
.nav-sub:hover { color: #fff; background: rgba(255,255,255,.04); }
.nav-sub.active { color: #fff; background: rgba(64,158,255,.18); border-right: 2px solid var(--primary); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }

.topbar {
  height: var(--topbar-height); flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--border-lighter);
  display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
}
.topbar-left { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-regular); }
.topbar-left .hamb { font-size: 16px; color: var(--text-regular); cursor: pointer; }
.crumb-sep { color: var(--text-placeholder); }
.crumb-cur { color: var(--text-primary); font-weight: 500; }
.topbar-right { display: flex; align-items: center; gap: 16px; color: var(--text-regular); font-size: 15px; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#5ad0e0,#3aa0c8);
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600;
}
.user-name { font-size: 13px; color: var(--text-regular); }

.tagsbar {
  height: var(--tagsview-height); flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--border-lighter);
  display: flex; align-items: center; gap: 6px; padding: 0 10px; overflow-x: auto;
}
.tag-item {
  display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 12px;
  font-size: 12px; color: var(--text-regular); background: #fff; border: 1px solid var(--border-light);
  border-radius: 3px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.tag-item.active { color: var(--primary); border-color: var(--primary-light-5); background: var(--primary-light-9); }
.tag-item .x { font-size: 13px; color: var(--text-placeholder); line-height: 1; padding: 1px; }
.tag-item .x:hover { color: var(--danger); }

.content { flex: 1; overflow-y: auto; padding: 16px; }
.page { display: none; }
.page.active { display: block; }

.card { background: #fff; border: 1px solid var(--border-lighter); border-radius: var(--radius-lg); padding: 16px 18px; }
.filter-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.field { display: flex; align-items: center; gap: 8px; }
.field label { font-size: 13px; color: var(--text-regular); white-space: nowrap; }
.tabs-inline { display: flex; gap: 26px; border-bottom: 1px solid var(--border-lighter); margin-bottom: 16px; }
.tabs-inline .t { padding: 0 2px 10px; font-size: 14px; color: var(--text-regular); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs-inline .t.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

input[type=text], input[type=number], input[type=date], select, textarea {
  height: 32px; border: 1px solid var(--border-base); border-radius: var(--radius);
  padding: 0 11px; font-size: 13px; outline: none; background: #fff; color: var(--text-regular);
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
textarea { padding: 8px 11px; resize: none; height: auto; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--text-placeholder); }
input[disabled], select[disabled], .input-readonly {
  background: var(--border-extra-light); color: var(--text-secondary); cursor: not-allowed;
}

.btn {
  height: 32px; padding: 0 15px; border-radius: var(--radius); font-size: 13px; border: 1px solid var(--border-base);
  background: #fff; color: var(--text-regular); display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark-2); border-color: var(--primary-dark-2); color: #fff; }
.btn-success { background: var(--success); border-color: var(--success); color: #fff; }
.btn-success:hover { opacity: .9; color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; color: #fff; }
.btn[disabled] { background: var(--border-extra-light) !important; border-color: var(--border-light) !important;
  color: var(--text-placeholder) !important; cursor: not-allowed; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.link-btn { color: var(--link-blue); font-size: 13px; cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--danger); }
.link-btn.muted { color: var(--text-placeholder); cursor: not-allowed; }
.link-btn.muted:hover { text-decoration: none; }

table.gtab { width: 100%; border-collapse: collapse; font-size: 13px; }
table.gtab th {
  text-align: left; padding: 10px 12px; background: #fafbfc; color: var(--text-regular); font-weight: 500;
  border-bottom: 1px solid var(--border-lighter); white-space: nowrap;
}
table.gtab td { padding: 11px 12px; border-bottom: 1px solid var(--border-lighter); color: var(--text-regular); white-space: nowrap; }
table.gtab tr:hover td { background: var(--primary-light-9); }
.act-links { display: inline-flex; gap: 12px; }
.pagebar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--text-regular); }
.page-num { min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px; background: #f4f4f5; cursor: pointer; }
.page-num.cur { background: var(--primary); color: #fff; }

.tag { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 3px; font-size: 12px; line-height: 20px; }
.tag-green { background: var(--success-light-9); color: var(--success); }
.tag-orange { background: var(--warning-light-9); color: var(--warning); }
.tag-blue { background: var(--primary-light-9); color: var(--link-blue); }
.tag-gray { background: var(--info-light-9); color: var(--text-secondary); }
.tag-red { background: var(--danger-light-9); color: var(--danger); }

.mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2000; display: none;
  align-items: flex-start; justify-content: center; padding: 60px 20px; overflow: auto;
}
.mask.show { display: flex; }
.dialog { width: 460px; max-width: 100%; background: #fff; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.2);
  display: flex; flex-direction: column; max-height: calc(100vh - 100px); }
.dialog.w-wide { width: 900px; }
.dialog.w-mid { width: 640px; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px;
  border-bottom: 1px solid var(--border-lighter); flex-shrink: 0; }
.dialog-head .t { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.dialog-head .x { cursor: pointer; font-size: 17px; color: var(--text-placeholder); }
.dialog-head .x:hover { color: var(--text-regular); }
.dialog-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px;
  border-top: 1px solid var(--border-lighter); flex-shrink: 0; }

.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
.fitem { display: flex; flex-direction: column; gap: 6px; }
.fitem.full { grid-column: 1 / -1; }
.fitem label { font-size: 13px; color: var(--text-regular); display: flex; align-items: center; gap: 4px; }
.fitem label .req { color: var(--danger); margin-right: 2px; }
.fitem input, .fitem select, .fitem textarea { width: 100%; }
.fitem .hint { font-size: 12px; color: var(--text-placeholder); }
.fitem .err { font-size: 12px; color: var(--danger); display: none; }
.fitem .err.show { display: block; }
.fitem.has-err input, .fitem.has-err select { border-color: var(--danger); }
.radio-row { display: flex; gap: 22px; height: 32px; align-items: center; }
.radio-opt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-regular); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.radio-opt input { accent-color: var(--primary); }

.info-tip { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px;
  border-radius: 50%; background: var(--border-base); color: #fff; font-size: 10px; font-style: normal;
  cursor: default; position: relative; }
.info-tip:hover .tip-pop { display: block; }
.tip-pop { display: none; position: absolute; left: 18px; top: -6px; background: rgba(30,30,32,.92); color: #fff;
  font-size: 12px; padding: 6px 10px; border-radius: 4px; white-space: nowrap; z-index: 10; }

.code-input-row { display: flex; align-items: center; }
.code-input-row input { border-radius: var(--radius); }
.code-counter { font-size: 12px; color: var(--text-placeholder); margin-left: 6px; white-space: nowrap; }
.no-input-wrap { display: flex; align-items: stretch; }
.no-prefix { display: flex; align-items: center; padding: 0 10px; background: var(--border-extra-light);
  border: 1px solid var(--border-base); border-right: none; border-radius: var(--radius) 0 0 var(--radius);
  font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
.no-input-wrap input { border-radius: 0 var(--radius) var(--radius) 0; flex: 1; min-width: 0; }
.full-code-preview { font-size: 13px; color: var(--text-regular); margin-top: 2px; }
.full-code-preview b { color: var(--primary); font-weight: 600; }
.code-warn { font-size: 12px; color: var(--danger); margin-top: 2px; display: flex; align-items: center; gap: 4px; }

.toggle { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider { position: absolute; cursor: pointer; inset: 0; background: var(--border-base); border-radius: 20px; transition: .15s; }
.toggle .slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px;
  background: #fff; border-radius: 50%; transition: .15s; }
.toggle input:checked + .slider { background: var(--primary); }
.toggle input:checked + .slider:before { transform: translateX(16px); }

.upload-box {
  width: 100px; height: 100px; border: 1px dashed var(--border-dark); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; color: var(--text-placeholder);
  font-size: 22px; cursor: pointer; flex-shrink: 0; background: #fafafa;
}
.upload-box:hover { border-color: var(--primary); color: var(--primary); }
.upload-box.done { border-style: solid; border-color: var(--success); color: var(--success); font-size: 13px; flex-direction: column; gap: 4px; }

.warn-banner {
  background: var(--warning-light-9); border: 1px solid #f6e6c0; color: var(--warning);
  border-radius: 6px; padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
}
.section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin: 4px 0 10px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; row-gap: 18px; column-gap: 40px; }
.info-item .k { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.info-item .v { font-size: 13px; color: var(--text-primary); }
.info-item .v.link { color: var(--link-blue); cursor: pointer; }
.info-item .v.link:hover { text-decoration: underline; }

hr.div { border: none; border-top: 1px solid var(--border-lighter); margin: 14px 0; }

.toast-wrap { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 8px; }
.toast { background: rgba(30,30,32,.9); color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 5px; box-shadow: 0 6px 18px rgba(0,0,0,.2); opacity: 0; transform: translateY(-6px); transition: all .2s; }
.toast.show { opacity: 1; transform: translateY(0); }

/* ---------- Asset module layout (tree + list) ---------- */
.asset-layout { display: flex; gap: 16px; align-items: flex-start; }
.tree-panel { width: 246px; flex-shrink: 0; background: #fff; border: 1px solid var(--border-lighter); border-radius: var(--radius-lg); padding: 14px; max-height: calc(100vh - 130px); overflow-y: auto; }
.tree-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tree-panel-head .ttl { font-size: 13px; color: var(--text-secondary); }
.tree-list { font-size: 13px; }
.tree-row { display: flex; align-items: center; gap: 4px; height: 32px; border-radius: var(--radius); padding: 0 6px; cursor: pointer; color: var(--text-regular); }
.tree-row:hover { background: var(--border-extra-light); }
.tree-row.active { background: var(--primary-light-9); color: var(--primary); }
.tree-row .exp { width: 14px; flex-shrink: 0; font-size: 10px; color: var(--text-placeholder); transition: transform .15s; text-align: center; }
.tree-row .exp.open { transform: rotate(90deg); }
.tree-row .exp.empty { visibility: hidden; }
.tree-row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-row .ic { display: inline-flex; width: 22px; height: 24px; margin-right: 8px; padding: 0 3px; font-size: 12px; color: var(--text-placeholder); }
.tree-row-ops { display: none; align-items: center; gap: 6px; flex-shrink: 0; }
.tree-row:hover .tree-row-ops { display: flex; }
.tree-row-ops span { color: var(--text-secondary); cursor: pointer; font-size: 13px; }
.tree-row-ops span:hover { color: var(--primary); }
.tree-row-ops span.del:hover { color: var(--danger); }
.tree-lv1 { }
.tree-lv2 { padding-left: 20px; }
.tree-lv3 { padding-left: 40px; }

.list-panel { flex: 1; min-width: 0; }
.list-scope { font-size: 13px; color: var(--text-regular); margin-bottom: 12px; }
.list-scope b { color: var(--text-primary); font-weight: 500; }
.list-scope .n { color: var(--primary); }

.ap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.ap-card { background: #fff; border: 1px solid var(--border-lighter); border-radius: var(--radius-lg); overflow: hidden; }
.ap-card .bar { height: 3px; background: var(--border-lighter); }
.ap-card .bar.rented { background: var(--success); }
.ap-card .bar.vacant { background: var(--border-light); }
.ap-card .bar.stopped { background: var(--text-placeholder); }
.ap-card .bd { padding: 14px 16px; }
.ap-card .row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ap-card .title { font-size: 14px; color: var(--link-blue); cursor: pointer; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ap-card .title:hover { text-decoration: underline; }
.ap-card .meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.ap-card .tenant { font-size: 13px; color: var(--text-secondary); }

.detail-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.detail-title { font-size: 20px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
.detail-meta { font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
.detail-ops { display: flex; gap: 10px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo"><span class="mark">PM</span><span>物业管理系统-test</span></div>
    <div class="nav" id="navRoot"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="hamb">&#9776;</span>
        <span id="crumb"></span>
      </div>
      <div class="topbar-right">
        <span>&#9974;</span><span>&#128269;</span><span>Tr</span><span>&#25991;</span><span>&#128276;</span>
        <div class="avatar">陈</div>
        <span class="user-name">陈寄尘</span>
      </div>
    </div>
    <div class="tagsbar" id="tagsBar"></div>
    <div class="content" id="contentRoot">

<!-- ============ 公寓管理列表 ============ -->
<section class="page" id="page-ap-list">
  <div class="asset-layout">
    <div class="tree-panel">
      <div class="tree-panel-head">
        <span class="ttl">园区 / 楼栋 / 楼层</span>
        <button class="btn btn-primary btn-sm" onclick="openZoneModal('ap')">＋ 园区</button>
      </div>
      <div class="tree-list" id="apTree"></div>
    </div>
    <div class="list-panel">
      <div class="card">
        <div class="list-scope" id="apScopeText"></div>
        <div class="filter-bar">
          <div class="field"><label>房间号</label><input type="text" id="apFilterNo" placeholder="请输入" style="width:140px"></div>
          <div class="field"><label>租户</label>
            <select id="apFilterTenant" style="width:130px"><option value="">请选择</option></select>
          </div>
          <div class="field"><label>出租状态</label>
            <select id="apFilterStatus" style="width:130px">
              <option value="">请选择</option>
              <option value="空置中">空置中</option>
              <option value="已出租">已出租</option>
              <option value="停用">停用</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="renderApList()">&#128269; 搜索</button>
          <button class="btn" onclick="resetApFilter()">&#8635; 重置</button>
          <button class="btn btn-primary" onclick="openAssetModal('ap')">＋ 添加公寓</button>
          <button class="btn">&#8593; 导入</button>
        </div>
        <div class="ap-grid" id="apGrid"></div>
        <div class="pagebar">
          <span>共 <span id="apCount"></span> 条</span>
          <span>10条/页</span>
          <span class="page-num cur">1</span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ 公寓详情 ============ -->
<section class="page" id="page-ap-detail">
  <div class="card">
    <div class="detail-head">
      <div>
        <div class="detail-title"><span id="apdTitle"></span><span id="apdStatusTag"></span></div>
        <div class="detail-meta" id="apdMeta"></div>
      </div>
      <div class="detail-ops" id="apdOps"></div>
    </div>
    <div class="tabs-inline">
      <div class="t active">基本信息</div>
      <div class="t">绑定账号</div>
      <div class="t">账单</div>
      <div class="t">水电表设备</div>
    </div>
    <div id="apdBody"></div>
  </div>

<div class="toast-wrap" id="toastWrap"></div>
<script>
/* ============================================================
   工具函数
   ============================================================ */
let uid = 1;
function nextId(){ return 'id' + (uid++); }
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 200); }, 2600);
}
function showModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function markUploaded(el){
  el.classList.add('done');
  el.innerHTML = '&#10003;<span style="font-size:11px">已上传</span>';
}
function openConfirm(title, msg, onOk, okText){
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').innerHTML = msg;
  const btn = document.getElementById('confirmOkBtn');
  btn.textContent = okText || '确定';
  const clone = btn.cloneNode(true);
  btn.parentNode.replaceChild(clone, btn);
  clone.addEventListener('click', ()=>{ closeModal('modalConfirm'); onOk(); });
  showModal('modalConfirm');
}
function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
const CODE_RE = /^[A-Z0-9]{1,4}$/;
const NO_RE = /^[A-Z0-9]{1,6}$/;
function isValidCode(code){ return !!code && CODE_RE.test(code); }
function onCodeInput(el){
  let v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  el.value = v;
  liveValidateCode(el.id);
}
function liveValidateCode(inputId){
  clearFieldErr(inputId);
  const val = document.getElementById(inputId).value;
  if (!val) return; // 输入为空时不提前报"必填"，留到提交校验
  const dupMsg = code => `该${{zoneCode:'园区',buildingCode:'楼栋',floorCode:'楼层'}[inputId]}代码已存在，请修改(可加后缀区分，例如YL，加后缀-1、-02)`;
  if (inputId === 'zoneCode') {
    const { type, editId } = zoneCtx;
    if (zoneCodeExists(type, val, editId)) setFieldErr(inputId, dupMsg(val));
  } else if (inputId === 'buildingCode') {
    const { type, editId, zoneId } = buildingCtx;
    if (buildingCodeExists(type, zoneId, val, editId)) setFieldErr(inputId, dupMsg(val));
  } else if (inputId === 'floorCode') {
    const { type, editId, buildingId } = floorCtx;
    if (floorCodeExists(type, buildingId, val, editId)) setFieldErr(inputId, dupMsg(val));
  }
}
function clearFieldErr(inputId){
  const err = document.getElementById('err-' + inputId);
  const fitem = document.getElementById('fi-' + inputId);
  if (err) { err.classList.remove('show'); err.textContent = ''; }
  if (fitem) fitem.classList.remove('has-err');
}
function setFieldErr(inputId, msg){
  const err = document.getElementById('err-' + inputId);
  const fitem = document.getElementById('fi-' + inputId);
  if (err) { err.textContent = msg; err.classList.add('show'); }
  if (fitem) fitem.classList.add('has-err');
}

/* ============================================================
   数据模型：分别维护"公寓(ap)"与"商铺(sh)"两套 园区/楼栋/楼层/资产 数据
   ============================================================ */
function makeStore(){ return { zones: [], buildings: [], floors: [], assets: [] }; }
const store = { ap: makeStore(), sh: makeStore() };

function zonesOf(type){ return store[type].zones; }
function buildingsOf(type){ return store[type].buildings; }
function floorsOf(type){ return store[type].floors; }
function assetsOf(type){ return store[type].assets; }
function findZone(type, id){ return zonesOf(type).find(z=>z.id===id); }
function findBuilding(type, id){ return buildingsOf(type).find(b=>b.id===id); }
function findFloor(type, id){ return floorsOf(type).find(f=>f.id===id); }
function findAsset(type, id){ return assetsOf(type).find(a=>a.id===id); }

function buildingsInZone(type, zoneId){
  return buildingsOf(type).filter(b=>b.zoneId===zoneId)
    .sort((a,b)=> (a.sort??999999)-(b.sort??999999) || a.createdAt.localeCompare(b.createdAt));
}
function floorsInBuilding(type, buildingId){
  return floorsOf(type).filter(f=>f.buildingId===buildingId)
    .sort((a,b)=> (a.sort??999999)-(b.sort??999999) || a.createdAt.localeCompare(b.createdAt));
}
function sortedZones(type){
  return zonesOf(type).slice().sort((a,b)=> (a.sort??999999)-(b.sort??999999) || a.createdAt.localeCompare(b.createdAt));
}

/* ---------- 编码前缀与完整编码 ---------- */
function computePrefix(type, zoneId, buildingId, floorId){
  const zone = findZone(type, zoneId);
  if (!zone || !isValidCode(zone.code)) return { valid:false, invalidLevel:'园区', prefix:'' };
  const building = buildingId ? findBuilding(type, buildingId) : null;
  if (buildingId && (!building || !isValidCode(building.code))) return { valid:false, invalidLevel:'楼栋', prefix:'' };
  let prefix = zone.code + (building ? building.code : '');
  if (floorId) {
    const floor = findFloor(type, floorId);
    if (!floor || !isValidCode(floor.code)) return { valid:false, invalidLevel:'楼层', prefix:'' };
    prefix += floor.code;
  }
  return { valid:true, invalidLevel:null, prefix };
}
function computeFullCode(prefix, no){
  if (!prefix || !no) return '';
  return prefix + '-' + no;
}
function recomputeFullCodes(type){
  assetsOf(type).forEach(a=>{
    if (!NO_RE.test(a.no)) return; // 历史不合规编号（含中文/特殊符号）不自动清洗，谁动谁改
    const r = computePrefix(type, a.zoneId, a.buildingId, a.floorId);
    if (r.valid) a.fullCode = computeFullCode(r.prefix, a.no);
  });
}
function countDescendantAssets(type, level, id){
  if (level === 'zone') return assetsOf(type).filter(a=>a.zoneId===id).length;
  if (level === 'building') return assetsOf(type).filter(a=>a.buildingId===id).length;
  if (level === 'floor') return assetsOf(type).filter(a=>a.floorId===id).length;
  return 0;
}

/* ---------- 唯一性校验 ---------- */
function zoneCodeExists(type, code, excludeId){
  return zonesOf(type).some(z=> z.id!==excludeId && z.code === code);
}
function buildingCodeExists(type, zoneId, code, excludeId){
  return buildingsOf(type).some(b=> b.id!==excludeId && b.zoneId===zoneId && b.code === code);
}
function floorCodeExists(type, buildingId, code, excludeId){
  return floorsOf(type).some(f=> f.id!==excludeId && f.buildingId===buildingId && f.code === code);
}
function assetNoExists(type, floorId, no, excludeId){
  return assetsOf(type).some(a=> a.id!==excludeId && a.floorId===floorId && a.no === no);
}
function fullCodeExists(type, fullCode, excludeId){
  return assetsOf(type).some(a=> a.id!==excludeId && a.fullCode === fullCode);
}
function suggestNextNo(type, floorId, excludeId){
  const used = new Set(
    assetsOf(type).filter(a=>a.floorId===floorId && a.id!==excludeId).map(a=>a.no)
  );
  for (let i=1;i<=99;i++){
    const s = String(i).padStart(2,'0');
    if (!used.has(s)) return s;
  }
  return null; // 01-99 已全部占用
}

let expanded = { ap:{}, sh:{} };
// 默认展开全部园区/楼栋，使左侧分支树一次性展示 园区/楼栋/楼层 三级结构
['ap','sh'].forEach(type=>{
  zonesOf(type).forEach(z=> expanded[type]['z:'+z.id] = true);
  buildingsOf(type).forEach(b=> expanded[type]['b:'+b.id] = true);
});

/* ============================================================
   左侧 园区/楼栋/楼层 树
   ============================================================ */
function selectScope(type, level, id){
  const s = scope[type];
  if (level === 'zone') { s.zoneId = id; s.buildingId = null; s.floorId = null; }
  else if (level === 'building') { s.buildingId = id; s.floorId = null; }
  else if (level === 'floor') { s.floorId = id; }
  else { s.zoneId = null; s.buildingId = null; s.floorId = null; }
  renderTree(type);
  if (type === 'ap') renderApList(); else renderShList();
}
function toggleExpand(type, key, evt){
  if (evt) evt.stopPropagation();
  expanded[type][key] = !expanded[type][key];
  renderTree(type);
}
function codeLabel(code){ return isValidCode(code) ? code : ''; }
function renderTree(type){
  const s = scope[type];
  const rows = [];
  rows.push(`<div class="tree-row ${!s.zoneId?'active':''}" onclick="selectScope('${type}','all',null)">
      <span class="exp empty"></span><span class="ic">&#9635;</span><span class="lbl">全部园区</span>
    </div>`);
  sortedZones(type).forEach(z=>{
    const zKey = 'z:' + z.id;
    const zOpen = !!expanded[type][zKey];
    const zBuildings = buildingsInZone(type, z.id);
    const hasChildren = zBuildings.length > 0;
    const zActive = s.zoneId===z.id && !s.buildingId;
    const zLabelWarn = '';
    rows.push(`<div class="tree-row tree-lv1 ${zActive?'active':''}" onclick="selectScope('${type}','zone','${z.id}')">
        <span class="exp ${hasChildren?'':'empty'} ${zOpen?'open':''}" onclick="toggleExpand('${type}','${zKey}',event)">${hasChildren?'&#8250;':''}</span>
        <span class="ic">&#9635;</span>
        <span class="lbl${zLabelWarn}">${z.name}</span>
        <span class="tree-row-ops">
          <span onclick="event.stopPropagation();openZoneModal('${type}','${z.id}')">&#9998;</span>
          <span class="del" onclick="event.stopPropagation();deleteZone('${type}','${z.id}')">&#128465;</span>
          <span onclick="event.stopPropagation();openBuildingModal('${type}',null,'${z.id}')">&#43;</span>
        </span>
      </div>`);
    if (zOpen) {
      zBuildings.forEach(b=>{
        const bKey = 'b:' + b.id;
        const bOpen = !!expanded[type][bKey];
        const bFloors = floorsInBuilding(type, b.id);
        const hasF = bFloors.length > 0;
        const bActive = s.buildingId===b.id && !s.floorId;
        const bLabelWarn = '';
        rows.push(`<div class="tree-row tree-lv2 ${bActive?'active':''}" onclick="selectScope('${type}','building','${b.id}')">
            <span class="exp ${hasF?'':'empty'} ${bOpen?'open':''}" onclick="toggleExpand('${type}','${bKey}',event)">${hasF?'&#8250;':''}</span>
            <span class="ic">&#9635;</span>
            <span class="lbl${bLabelWarn}">${b.name}</span>
            <span class="tree-row-ops">
              <span onclick="event.stopPropagation();openBuildingModal('${type}','${b.id}')">&#9998;</span>
              <span class="del" onclick="event.stopPropagation();deleteBuilding('${type}','${b.id}')">&#128465;</span>
              <span onclick="event.stopPropagation();openFloorModal('${type}',null,'${b.id}')">&#43;</span>
            </span>
          </div>`);
        if (bOpen) {
          bFloors.forEach(f=>{
            const fActive = s.floorId===f.id;
            const fLabelWarn = '';
            rows.push(`<div class="tree-row tree-lv3 ${fActive?'active':''}" onclick="selectScope('${type}','floor','${f.id}')">
                <span class="exp empty"></span><span class="ic"></span>
                <span class="lbl${fLabelWarn}">${f.name}</span>
                <span class="tree-row-ops">
                  <span onclick="event.stopPropagation();openFloorModal('${type}','${f.id}')">&#9998;</span>
                  <span class="del" onclick="event.stopPropagation();deleteFloor('${type}','${f.id}')">&#128465;</span>
                </span>
              </div>`);
          });
        }
      });
    }
  });
  document.getElementById(type==='ap'?'apTree':'shTree').innerHTML = rows.join('');
}

/* ============================================================
   作用域筛选 & 面包屑文案
   ============================================================ */
function scopeAssets(type){
  const s = scope[type];
  let list = assetsOf(type);
  if (s.floorId) list = list.filter(a=>a.floorId===s.floorId);
  else if (s.buildingId) list = list.filter(a=>a.buildingId===s.buildingId);
  else if (s.zoneId) list = list.filter(a=>a.zoneId===s.zoneId);
  return list;
}
function scopeText(type){
  const s = scope[type];
  if (!s.zoneId) return '全部';
  const z = findZone(type, s.zoneId);
  let t = z ? z.name : '';
  if (s.buildingId) { const b = findBuilding(type, s.buildingId); if (b) t += '/' + b.name; }
  if (s.floorId) { const f = findFloor(type, s.floorId); if (f) t += '/' + f.name; }
  return t;
}

/* ============================================================
   出租状态标签
   ============================================================ */
function statusTag(status){
  if (status === '已出租') return `<span class="tag tag-green">已出租</span>`;
  if (status === '空置中') return `<span class="tag tag-gray">空置</span>`;
  if (status === '停用') return `<span class="tag tag-red">停用</span>`;
  return `<span class="tag tag-gray">${status}</span>`;
}
function statusTagFull(status){
  if (status === '已出租') return `<span class="tag tag-green">已出租</span>`;
  if (status === '空置中') return `<span class="tag tag-gray">空置中</span>`;
  if (status === '停用') return `<span class="tag tag-red">停用</span>`;
  return `<span class="tag tag-gray">${status}</span>`;
}
function statusBarClass(status){
  if (status === '已出租') return 'rented';
  if (status === '停用') return 'stopped';
  return 'vacant';
}

/* ============================================================
   详情页操作按钮（编辑/删除/停用/恢复空置/返回）
   ============================================================ */
function detailOpsHtml(type, a){
  let canDelete = false, canStop = false, canRestore = false;
  if (a.status === '已出租') { canDelete=false; canStop=false; canRestore=false; }
  else if (a.status === '空置中') { canDelete=false; canStop=true; canRestore=false; }
  else if (a.status === '停用') { canDelete=true; canStop=false; canRestore=true; }
  const backKey = type === 'ap' ? 'aplist' : 'shlist';
  const backLabel = type === 'ap' ? '公寓管理' : '商铺管理';
  let html = `<button class="btn" onclick="openAssetModal('${type}','${a.id}')">编辑</button>`;
  if (canDelete) html += `<button class="btn" onclick="handleDelete('${type}','${a.id}')">删除</button>`;
  if (canStop) html += `<button class="btn" onclick="openStopReasonModal('${type}','${a.id}')">停用</button>`;
  if (canRestore) html += `<button class="btn btn-primary" onclick="handleRestore('${type}','${a.id}')">恢复空置</button>`;
  html += `<button class="btn" onclick="openPage('${backKey}','${backLabel}')">返回 &#8250;</button>`;
  return html;
}
let stopReasonCtx = { type:'ap', id:null };
function openStopReasonModal(type, id){
  stopReasonCtx = { type, id };
  const input = document.getElementById('stopReasonInput');
  input.value = '';
  updateStopReasonCounter();
  showModal('modalStopReason');
}
function updateStopReasonCounter(){
  const input = document.getElementById('stopReasonInput');
  document.getElementById('stopReasonCounter').textContent = input.value.length + ' / 100';
}
function submitStopReason(){
  const { type, id } = stopReasonCtx;
  const a = findAsset(type, id);
  if (!a) return;
  const reason = document.getElementById('stopReasonInput').value.trim();
  if (!reason) { toast('请填写停用原因'); return; }
  a.status = '停用';
  a.stopReason = reason;
  closeModal('modalStopReason');
  toast('已停用');
  if (type==='ap') renderApDetail(); else renderShDetail();
}
function handleRestore(type, id){
  const a = findAsset(type, id);
  if (!a) return;
  openConfirm('提示', `恢复该${a.fullCode}出租状态为空置中吗？`, ()=>{
    a.status = '空置中';
    a.stopReason = '';
    toast('已恢复为空置中');
    if (type==='ap') renderApDetail(); else renderShDetail();
  });
}
function handleDelete(type, id){
  const a = findAsset(type, id);
  if (!a) return;
  const assetLabel = type === 'ap' ? '公寓' : '商铺';
  openConfirm('提示', `确认删除该${assetLabel}（${a.fullCode}）吗？删除后不可恢复。`, ()=>{
    const arr = assetsOf(type);
    const idx = arr.findIndex(x=>x.id===id);
    if (idx>-1) arr.splice(idx,1);
    toast('已删除');
    if (type==='ap') { openPage('aplist','公寓管理'); renderApList(); }
    else { openPage('shlist','商铺管理'); renderShList(); }
  }, '确定删除');
}

let zoneCtx = { type:'ap', editId:null };
function openZoneModal(type, editId){
  zoneCtx = { type, editId: editId||null };
  clearFieldErr('zoneCode');
  if (editId) {
    const z = findZone(type, editId);
    document.getElementById('zoneModalTitle').textContent = '编辑园区';
    document.getElementById('zoneName').value = z.name;
    document.getElementById('zoneCode').value = z.code || '';
    document.getElementById('zoneSort').value = z.sort ?? 1;
  } else {
    document.getElementById('zoneModalTitle').textContent = '添加园区';
    document.getElementById('zoneName').value = '';
    document.getElementById('zoneCode').value = '';
    document.getElementById('zoneSort').value = 1;
  }
  showModal('modalZone');
}
function submitZone(){
  const { type, editId } = zoneCtx;
  const name = document.getElementById('zoneName').value.trim();
  const code = document.getElementById('zoneCode').value.trim().toUpperCase();
  const sort = document.getElementById('zoneSort').value;
  clearFieldErr('zoneCode');
  if (!name) { toast('请输入园区名称'); return; }
  if (!isValidCode(code)) { setFieldErr('zoneCode', '格式：1-4位大写字母或数字组合'); return; }
  if (zoneCodeExists(type, code, editId)) {
    setFieldErr('zoneCode', '该园区代码已存在，请修改(可加后缀区分，例如YL，加后缀-1、-02)');
    return;
  }
  const doSave = ()=>{
    if (editId) {
      const z = findZone(type, editId);
      z.name = name; z.code = code; z.sort = sort===''?null:Number(sort);
      recomputeFullCodes(type);
    } else {
      zonesOf(type).push({ id: nextId(), name, code, sort: sort===''?null:Number(sort), createdAt: nowStr() });
    }
    closeModal('modalZone');
    toast('保存成功');
    if (type==='ap') renderApList(); else renderShList();
  };
  if (editId) {
    const z = findZone(type, editId);
    const codeChanged = z.code !== code;
    const affected = countDescendantAssets(type, 'zone', editId);
    if (codeChanged && affected > 0) {
      openConfirm('提示',
        `修改后该园区下 ${affected} 个资产的完整编码将全部变化（如 ${z.code||'--'}xxx-01 → ${code}xxx-01），历史账单展示的编号为快照值不受影响。是否继续？`,
        doSave);
      return;
    }
  }
  doSave();
}
function deleteZone(type, id){
  const affected = countDescendantAssets(type, 'zone', id);
  if (affected > 0) { toast('该园区下存在资产，不可删除'); return; }
  const hasBuildings = buildingsInZone(type, id).length > 0;
  if (hasBuildings) { toast('该园区下存在楼栋，不可删除'); return; }
  openConfirm('提示', '确认删除该园区吗？删除后不可恢复。', ()=>{
    const arr = zonesOf(type);
    const idx = arr.findIndex(z=>z.id===id);
    if (idx>-1) arr.splice(idx,1);
    if (scope[type].zoneId === id) scope[type] = { zoneId:null, buildingId:null, floorId:null };
    toast('已删除');
    if (type==='ap') renderApList(); else renderShList();
  }, '确定删除');
}

   公寓/商铺 新增/编辑 弹窗

let assetCtx = { type:'ap', editId:null };
function fillSelect(selectEl, items, placeholder){
  selectEl.innerHTML = `<option value="">${placeholder}</option>` +
    items.map(it=>`<option value="${it.id}">${it.name}</option>`).join('');
}
function openAssetModal(type, editId){
  assetCtx = { type, editId: editId || null };
  const isShop = type === 'sh';
  document.getElementById('assetModalTitle').textContent = editId ? (isShop?'编辑商铺':'编辑公寓') : (isShop?'添加商铺':'添加公寓');
  document.getElementById('assetNoLabel').textContent = isShop ? '商铺号' : '公寓编号';
  document.getElementById('assetImgLabel').textContent = isShop ? '商铺图片' : '公寓图片';
  document.getElementById('assetFloorReq').style.display = isShop ? 'none' : '';
  document.getElementById('assetAreaReq').textContent = isShop ? '*' : '';
  document.getElementById('fi-assetRoomType').style.display = isShop ? 'none' : '';
  document.getElementById('fi-assetTransfer').style.display = isShop ? '' : 'none';
  document.getElementById('fi-assetRecruit').style.display = isShop ? '' : 'none';

  fillSelect(document.getElementById('assetZone'), sortedZones(type), '请选择所属园区');
  document.getElementById('assetBuilding').innerHTML = `<option value="">请选择所属楼栋</option>`;
  document.getElementById('assetFloor').innerHTML = `<option value="">${isShop?'请选择楼层（选填）':'请选择楼层'}</option>`;
  clearFieldErr('assetNo');

  if (editId) {
    const a = findAsset(type, editId);
    document.getElementById('assetZone').value = a.zoneId;
    fillSelect(document.getElementById('assetBuilding'), buildingsInZone(type, a.zoneId), '请选择所属楼栋');
    document.getElementById('assetBuilding').value = a.buildingId;
    fillSelect(document.getElementById('assetFloor'), floorsInBuilding(type, a.buildingId), isShop?'请选择楼层（选填）':'请选择楼层');
    document.getElementById('assetFloor').value = a.floorId || '';
    if (!isShop) document.getElementById('assetRoomType').value = a.roomType || '单间';
    document.getElementById('assetArea').value = a.area || '';
    document.getElementById('assetNo').value = a.no || '';
    document.getElementById('assetStatus').value = a.status || '空置中';
    if (isShop) {
      document.getElementById('assetTransfer').value = a.transfer || '否';
      document.getElementById('assetRecruit').checked = !!a.recruit;
    }
  } else {
    document.getElementById('assetRoomType').value = '单间';
    document.getElementById('assetArea').value = '';
    document.getElementById('assetNo').value = '';
    document.getElementById('assetStatus').value = '空置中';
    if (isShop) { document.getElementById('assetTransfer').value = '否'; document.getElementById('assetRecruit').checked = false; }
  }
  updateAssetCodePreview();
  showModal('modalAsset');
}
function onAssetZoneChange(){
  const type = assetCtx.type;
  const zoneId = document.getElementById('assetZone').value;
  fillSelect(document.getElementById('assetBuilding'), zoneId ? buildingsInZone(type, zoneId) : [], '请选择所属楼栋');
  document.getElementById('assetFloor').innerHTML = `<option value="">${type==='sh'?'请选择楼层（选填）':'请选择楼层'}</option>`;
  updateAssetCodePreview();
  liveValidateAssetNo();
}
function onAssetBuildingChange(){
  const type = assetCtx.type;
  const buildingId = document.getElementById('assetBuilding').value;
  fillSelect(document.getElementById('assetFloor'), buildingId ? floorsInBuilding(type, buildingId) : [], type==='sh'?'请选择楼层（选填）':'请选择楼层');
  updateAssetCodePreview();
  liveValidateAssetNo();
}
function onAssetFloorChange(){ updateAssetCodePreview(); liveValidateAssetNo(); }
function onAssetNoInput(){
  const el = document.getElementById('assetNo');
  el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  updateAssetCodePreview();
  liveValidateAssetNo();
}
function liveValidateAssetNo(){
  clearFieldErr('assetNo');
  const { type, editId } = assetCtx;
  const no = document.getElementById('assetNo').value;
  if (!no) return; // 输入为空时不提前报"必填"，留到提交校验
  const zoneId = document.getElementById('assetZone').value;
  const buildingId = document.getElementById('assetBuilding').value;
  const floorId = document.getElementById('assetFloor').value || null;
  if (!zoneId || !buildingId) return;
  if (assetNoExists(type, floorId, no, editId)) { setFieldErr('assetNo', '该编号已存在，请修改'); return; }
  const r = computePrefix(type, zoneId, buildingId, floorId);
  if (r.valid) {
    const fullCode = computeFullCode(r.prefix, no);
    if (fullCodeExists(type, fullCode, editId)) {
      setFieldErr('assetNo', '该资产编码已存在，请修改（可加后缀区分，例如YL，加后缀-1、-02）');
    }
  }
}
function clearAllLevelWarns(){
  ['warn-assetZone','warn-assetBuilding','warn-assetFloor'].forEach(id=>{
    const el = document.getElementById(id);
    if (el) { el.style.display = 'none'; el.innerHTML = ''; }
  });
}
function levelWarnId(invalidLevel){
  if (invalidLevel === '园区') return 'warn-assetZone';
  if (invalidLevel === '楼栋') return 'warn-assetBuilding';
  if (invalidLevel === '楼层') return 'warn-assetFloor';
  return null;
}
function updateAssetCodePreview(){
  const type = assetCtx.type;
  const zoneId = document.getElementById('assetZone').value;
  const buildingId = document.getElementById('assetBuilding').value;
  const floorId = document.getElementById('assetFloor').value;
  const no = document.getElementById('assetNo').value;
  const submitBtn = document.getElementById('assetSubmitBtn');
  const suggestBox = document.getElementById('assetNoSuggest');
  clearAllLevelWarns();

  const showInvalid = (invalidLevel)=>{
    document.getElementById('assetPrefix').textContent = '--';
    document.getElementById('assetFullCodePreview').innerHTML = '完整编码：--';
    const warnId = levelWarnId(invalidLevel);
    if (warnId) {
      const warnBox = document.getElementById(warnId);
      warnBox.style.display = 'flex';
      warnBox.innerHTML = `&#9888; 该${invalidLevel}代码不符合格式，请先编辑该${invalidLevel}的代码`;
    }
    submitBtn.disabled = true;
    suggestBox.textContent = '';
  };

  if (!zoneId) {
    document.getElementById('assetPrefix').textContent = '--';
    document.getElementById('assetFullCodePreview').innerHTML = '完整编码：--';
    submitBtn.disabled = false;
    suggestBox.textContent = '';
    return;
  }
  // 选定园区后立即校验园区代码，无需等待选择楼栋
  const zone = findZone(type, zoneId);
  if (!zone || !isValidCode(zone.code)) { showInvalid('园区'); return; }

  if (!buildingId) {
    document.getElementById('assetPrefix').textContent = '--';
    document.getElementById('assetFullCodePreview').innerHTML = '完整编码：--';
    submitBtn.disabled = false;
    suggestBox.textContent = '';
    return;
  }
  const r = computePrefix(type, zoneId, buildingId, floorId || null);
  if (!r.valid) { showInvalid(r.invalidLevel); return; }
  submitBtn.disabled = false;
  document.getElementById('assetPrefix').textContent = r.prefix + '-';
  document.getElementById('assetFullCodePreview').innerHTML =
    `完整编码：<b>${no ? computeFullCode(r.prefix, no) : (r.prefix + '-')}</b>`;
  if (floorId) {
    const excludeId = assetCtx.editId;
    const existingCount = assetsOf(type).filter(a=>a.floorId===floorId && a.id!==excludeId).length;
    const next = suggestNextNo(type, floorId, excludeId);
    if (!next) {
      suggestBox.textContent = '';
    } else if (existingCount === 0) {
      suggestBox.textContent = `建议：从 ${next} 开始`;
    } else {
      suggestBox.textContent = `建议：下一个可用编号为 ${next}`;
    }
  } else {
    suggestBox.textContent = '';
  }
}
function submitAsset(){
  const { type, editId } = assetCtx;
  const isShop = type === 'sh';
  const zoneId = document.getElementById('assetZone').value;
  const buildingId = document.getElementById('assetBuilding').value;
  const floorId = document.getElementById('assetFloor').value || null;
  const roomType = document.getElementById('assetRoomType').value;
  const area = document.getElementById('assetArea').value.trim();
  const no = document.getElementById('assetNo').value.trim().toUpperCase();
  const status = document.getElementById('assetStatus').value;
  const transfer = isShop ? document.getElementById('assetTransfer').value : undefined;
  const recruit = isShop ? document.getElementById('assetRecruit').checked : undefined;

  clearFieldErr('assetNo');
  if (!zoneId) { toast('请选择所属园区'); return; }
  if (!buildingId) { toast('请选择所属楼栋'); return; }
  if (!isShop && !floorId) { toast('请选择楼层'); return; }
  if (!isShop && !roomType) { toast('请选择房型'); return; }
  if (isShop && !area) { toast('请输入面积'); return; }
  if (!no) { toast('请输入' + (isShop?'商铺号':'公寓编号')); return; }
  if (!NO_RE.test(no)) { setFieldErr('assetNo', '格式：1-6位字母或数字组合'); return; }

  const r = computePrefix(type, zoneId, buildingId, floorId);
  if (!r.valid) { updateAssetCodePreview(); return; }

  if (assetNoExists(type, floorId, no, editId)) {
    setFieldErr('assetNo', '该编号已存在，请修改');
    return;
  }
  const fullCode = computeFullCode(r.prefix, no);
  if (fullCodeExists(type, fullCode, editId)) {
    setFieldErr('assetNo', '该资产编码已存在，请修改（可加后缀区分，例如YL，加后缀-1、-02）');
    return;
  }

  if (editId) {
    const a = findAsset(type, editId);
    a.zoneId = zoneId; a.buildingId = buildingId; a.floorId = floorId;
    if (!isShop) a.roomType = roomType;
    a.area = area; a.no = no; a.fullCode = fullCode; a.status = status;
    if (isShop) { a.transfer = transfer; a.recruit = recruit; }
  } else {
    const base = {
      id: nextId(), zoneId, buildingId, floorId, no, fullCode,
      area, status, tenant:'--', phone:'--', rent:'', propertyFee:'', mainFee:'', cleanFee:'',
      createdAt: nowStr(), creator:'陈寄尘', hasRelated:false,
    };
    if (isShop) { base.transfer = transfer; base.recruit = recruit; }
    else { base.roomType = roomType; base.depositStd=''; base.deposit=''; }
    assetsOf(type).push(base);
  }
  closeModal('modalAsset');
  toast('保存成功');
  if (type==='ap') { renderApList(); if (curApDetailId===editId) renderApDetail(); }
  else { renderShList(); if (curShDetailId===editId) renderShDetail(); }
}

/* ============================================================
   Sidebar / nav
   ============================================================ */

  { k:'home', label:'首页', icon:icHome(), leaf:true },
  { k:'overview', label:'数据概览', icon:icChart(), leaf:true },
  { k:'assetGroup', label:'资产管理', icon:icBuilding(), open:true, children:[
      { k:'aplist', label:'公寓管理' },
      { k:'shlist', label:'商铺管理' },
      { k:'parking', label:'车位管理' },
    ] },
  { k:'contractGroup', label:'合同管理', icon:icDoc(), children:[{k:'c1',label:'合同列表'},{k:'c2',label:'退租管理'}] },
  { k:'bill', label:'账单中心', icon:icBill(), children:[{k:'b1',label:'租金账单'},{k:'b2',label:'水电账单'},{k:'b3',label:'服务账单'}] },
  { k:'cashier', label:'收银对账', icon:icWallet(), children:[{k:'ca1',label:'交易订单'}] },
  { k:'service', label:'物业服务', icon:icBell(), children:[{k:'s1',label:'账号审核'}] },
  { k:'sys', label:'系统管理', icon:icGear(), children:[{k:'y1',label:'角色权限'}] },
  { k:'pay', label:'支付管理', icon:icCard(), children:[{k:'p1',label:'支付渠道'}] },
];
function icHome(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>`; }
function icChart(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>`; }
function icBuilding(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/></svg>`; }
function icDoc(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l3 3v15H6z"/><path d="M9 12h6M9 16h6"/></svg>`; }
function icBill(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>`; }
function icWallet(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg>`; }
function icBell(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg>`; }
function icGear(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.2-1.6l2-1.6-2-3.4-2.3.9a7 7 0 00-2.8-1.6L13.3 2h-2.6l-.4 2.7a7 7 0 00-2.8 1.6l-2.3-.9-2 3.4 2 1.6A7 7 0 005 12c0 .5 0 1.1.2 1.6l-2 1.6 2 3.4 2.3-.9a7 7 0 002.8 1.6l.4 2.7h2.6l.4-2.7a7 7 0 002.8-1.6l2.3.9 2-3.4-2-1.6c.1-.5.2-1.1.2-1.6z"/></svg>`; }
function icCard(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>`; }

function renderNav(){
  const root = document.getElementById('navRoot');
  root.innerHTML = navData.map(g => {
    if (g.leaf) {
      return `<div class="nav-item" onclick="onNavLeaf('${g.k}')"><span class="ic">${g.icon}</span><span class="lbl">${g.label}</span></div>`;
    }
    const openCls = g.open ? 'open' : '';
    const childHtml = (g.children||[]).map(c => `<div class="nav-sub" data-page="${c.k}" onclick="onNavSub('${c.k}')">${c.label}</div>`).join('');
    return `<div>
      <div class="nav-item ${openCls}" data-group="${g.k}" onclick="toggleGroup('${g.k}')"><span class="ic">${g.icon}</span><span class="lbl">${g.label}</span><span class="chev">&#8250;</span></div>
      <div class="nav-children ${g.open?'':'collapsed'}" data-groupbody="${g.k}">${childHtml}</div>
    </div>`;
  }).join('');
  updateNavActive();
}
function toggleGroup(k){
  const g = navData.find(x=>x.k===k);
  if (!g || g.leaf) return;
  g.open = !g.open;
  renderNav();
}
function onNavLeaf(){ toast('该模块未在本次原型范围内演示'); }
function onNavSub(k){
  if (k === 'aplist') openPage('aplist', '公寓管理');
  else if (k === 'shlist') openPage('shlist', '商铺管理');
  else if (k === 'parking') toast('车位管理已具备完整编码唯一性校验，维持现状，本次不涉及改造');
  else toast('该模块未在本次原型范围内演示');
}
function updateNavActive(){
  document.querySelectorAll('.nav-sub').forEach(el=>{
    const p = el.getAttribute('data-page');
    const on = p === curPage || (p==='aplist' && (curPage==='apdetail')) || (p==='shlist' && (curPage==='shdetail'));
    el.classList.toggle('active', on);
  });
}

/* ============================================================
   Tabs / 页面路由
   ============================================================ */
let openTabs = ['aplist'];
let curPage = 'aplist';
const pageLabels = { aplist:'公寓管理', apdetail:'公寓详情', shlist:'商铺管理', shdetail:'商铺详情' };
const pageCrumb = {
  aplist:['资产管理','公寓管理'], apdetail:['资产管理','公寓管理','公寓详情'],
  shlist:['资产管理','商铺管理'], shdetail:['资产管理','商铺管理','商铺详情'],
};
const pageIdMap = { aplist:'page-ap-list', apdetail:'page-ap-detail', shlist:'page-sh-list', shdetail:'page-sh-detail' };
function openPage(key, label){
  if (!openTabs.includes(key)) openTabs.push(key);
  curPage = key;
  renderTabs(); renderPages(); updateNavActive(); updateCrumb();
}
function closeTab(key, evt){
  if (evt) evt.stopPropagation();
  if (key === 'aplist') return;
  openTabs = openTabs.filter(k => k !== key);
  if (curPage === key) curPage = openTabs[openTabs.length-1] || 'aplist';
  renderTabs(); renderPages(); updateNavActive(); updateCrumb();
}
function renderTabs(){
  const bar = document.getElementById('tagsBar');
  bar.innerHTML = openTabs.map(k => {
    const closable = k !== 'aplist';
    return `<div class="tag-item ${k===curPage?'active':''}" onclick="switchTab('${k}')">${pageLabels[k]||k}${closable?`<span class="x" onclick="closeTab('${k}',event)">&#10005;</span>`:''}</div>`;
  }).join('');
}
function switchTab(k){ curPage = k; renderTabs(); renderPages(); updateNavActive(); updateCrumb(); }
function renderPages(){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pageId = pageIdMap[curPage] || 'page-ap-list';
  document.getElementById(pageId).classList.add('active');
  if (curPage === 'aplist') renderApList();
  if (curPage === 'apdetail') renderApDetail();
  if (curPage === 'shlist') renderShList();
  if (curPage === 'shdetail') renderShDetail();
}
function updateCrumb(){
  const parts = pageCrumb[curPage] || ['首页'];
  document.getElementById('crumb').innerHTML = parts.map((p,i)=> i===parts.length-1 ? `<span class="crumb-cur">${p}</span>` : `${p} <span class="crumb-sep">/</span> `).join('');
}

/* ============================================================
   Init
   ============================================================ */
renderNav();
openPage('aplist', '公寓管理');
</script>
