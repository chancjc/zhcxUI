<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>账号台账管理 - 原型列表</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #24292f;
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 15px 0;
            padding: 10px;
            background: #f6f8fa;
            border-radius: 6px;
            transition: background 0.2s;
        }
        li:hover {
            background: #eaeef2;
        }
        a {
            color: #0969da;
            text-decoration: none;
            font-size: 16px;
            display: block;
        }
        a:hover {
            text-decoration: underline;
        }
        .back {
            margin-bottom: 20px;
            display: inline-block;
            font-size: 14px;
        }
        .count {
            color: #57606a;
            font-size: 14px;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #eaeef2;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back">← 返回所有模块</a>
        <h1>📂 账号台账管理</h1>
        <ul>
            <li><a href="01展现形式优化(增加账号组视图)/">📄 01展现形式优化(增加账号组视图)</a></li>
            <!-- 以后新增子需求，继续往下加 <li> 即可 -->
        </ul>
        <div class="count">
            共 <span id="count">1</span> 个原型
        </div>
    </div>
    <script>
        // 自动统计数量
        const count = document.querySelectorAll('ul li').length;
        document.getElementById('count').innerText = count;
    </script>
</body>
</html>
