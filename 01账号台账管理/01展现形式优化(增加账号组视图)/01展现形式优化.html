<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号台账管理</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --primary-color: #1890ff;
            --primary-hover: #40a9ff;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-secondary: #666666;
            --border-color: #e8e8e8;
            --line-color: #f5f5f5;
            --danger-color: #ff4d4f;
            --warning-color: #faad14;
            --success-color: #52c41a;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --border-radius: 8px;
            --transition: all 0.3s ease;
            --sticky-height: 72px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .sticky-group-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--sticky-height);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
            border-bottom: 1px solid rgba(232, 232, 232, 0.9);
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 24px;
        }

        .sticky-group-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .sticky-group-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .view-switch {
            display: inline-flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 4px;
            flex-shrink: 0;
        }

        .view-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .view-btn.active {
            background: #ffffff;
            color: var(--primary-color);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .container {
            padding: calc(var(--sticky-height) + 16px) 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1440px;
            margin: 0 auto;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .top-panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-panel-title::before {
            content: "";
            width: 3px;
            height: 14px;
            border-radius: 2px;
            background: var(--primary-color);
        }

        .btn-link {
            border: none;
            background: transparent;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 13px;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .dashboard-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.25s ease;
            max-height: 1000px;
            opacity: 1;
            overflow: hidden;
        }

        .dashboard-section.collapsed {
            max-height: 0;
            opacity: 0;
            margin: 0;
            pointer-events: none;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        .card-group {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .card-group-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .metric-value {
            font-size: 30px;
            line-height: 1.1;
            font-weight: 600;
            color: var(--text-main);
        }

        .metric-sub {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .metric-highlight {
            color: var(--primary-color);
        }

        .progress-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .progress-list-container::-webkit-scrollbar {
            width: 4px;
        }

        .progress-list-container::-webkit-scrollbar-thumb {
            background: #d9d9d9;
            border-radius: 999px;
        }

        .progress-item {
            display: grid;
            grid-template-columns: 72px 1fr 42px;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .progress-track {
            height: 8px;
            background-color: #f3f5f7;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #91caff 0%, #1677ff 100%);
            border-radius: 999px;
        }

        .chart-box {
            width: 100%;
            height: 140px;
        }

        .search-panel {
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px 24px;
        }

        .search-primary-row {
            display: grid;
            grid-template-columns: minmax(180px, 220px) minmax(220px, 1fr) minmax(220px, 1fr) auto;
            gap: 16px 24px;
            align-items: end;
        }

        .search-inline-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .search-grid.collapsed .advanced-item {
            display: none;
        }

        .form-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-item label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-item input,
        .form-item select {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            font-size: 13px;
            transition: var(--transition);
            width: 100%;
            height: 32px;
            background-color: #fff;
        }

        .form-item input:focus,
        .form-item select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.12);
        }

        .search-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-top: 1px dashed var(--border-color);
            padding-top: 16px;
        }

        .search-actions-left,
        .search-actions-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-actions-right {
            justify-content: flex-end;
            margin-left: auto;
        }

        .table-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        .table-toolbar {
            padding: 16px 24px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
        }

        .table-toolbar-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .table-current-group-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .table-current-group-value {
            font-size: 20px;
            line-height: 1.2;
            font-weight: 600;
            color: var(--primary-color);
            white-space: nowrap;
        }

        .table-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .table-container {
            flex: 1;
            min-height: 0;
            overflow: auto;
            height: clamp(360px, 42vh, 520px);
        }

        table {
            width: 100%;
            min-width: 860px;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #fafafa;
            font-weight: 600;
            color: var(--text-secondary);
        }

        th,
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        tbody tr.group-start td {
            box-shadow: inset 0 6px 0 #f5f8fc;
        }

        tbody tr.group-even td {
            background: #fcfdff;
        }

        tbody tr.group-odd td {
            background: #ffffff;
        }

        tbody tr:hover td {
            background-color: #f7fbff;
        }

        .group-chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            line-height: 1;
            white-space: nowrap;
            background: #e6f4ff;
            color: var(--primary-color);
            font-weight: 600;
        }

        .group-chip-muted {
            background: #f5f5f5;
            color: #5f6b7a;
            border: 1px solid #e8e8e8;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 48px 16px;
        }

        .foot-tip {
            padding: 0 24px 18px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .pagination-section {
            padding: 12px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: var(--card-bg);
        }

        .page-info {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .page-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-size-select {
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            background: #fff;
        }

        .page-btn {
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .page-btn:disabled {
            background: #f5f5f5;
            color: #bfbfbf;
            cursor: not-allowed;
        }

        @media (max-width: 1100px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .search-primary-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            .sticky-group-bar {
                height: auto;
                padding-top: 12px;
                padding-bottom: 12px;
                align-items: flex-start;
                flex-direction: column;
            }

            .container {
                padding-top: calc(var(--sticky-height) + 56px);
            }
        }

        @media (max-width: 720px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .search-primary-row {
                grid-template-columns: 1fr;
            }

            .table-toolbar,
            .section-head,
            .search-actions {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-inline-actions,
            .search-actions-right {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="sticky-group-bar">
        <div class="sticky-group-main">
            <div class="sticky-group-label">账号台账管理</div>
        </div>
    </div>

    <div class="container">
        <div class="top-panel-head">
            <div class="top-panel-title">数据看板</div>
            <button class="btn btn-outline" id="toggleDashboardBtn" type="button">收起看板 ▲</button>
        </div>

        <section class="dashboard-section" id="dashboardSection">
            <div class="dashboard-grid">
                <div class="card-group">
                    <div class="card-group-title">店铺状态</div>
                    <div class="chart-box" id="statusChart"></div>
                </div>
                <div class="card-group">
                    <div class="card-group-title">休假模式</div>
                    <div class="chart-box" id="vacationChart"></div>
                </div>
                <div class="card-group">
                    <div class="card-group-title">运营模式</div>
                    <div class="chart-box" id="opModeChart"></div>
                </div>
                <div class="card-group">
                    <div class="card-group-title">预警类</div>
                    <div class="progress-list-container" id="warningProgressContainer"></div>
                </div>
            </div>
        </section>

        <section class="search-panel">
            <div class="search-primary-row">
                <div class="form-item">
                    <label for="groupFilter">账号组</label>
                    <select id="groupFilter"></select>
                </div>
                <div class="form-item">
                    <label for="storeFilter">来源渠道（店铺名）</label>
                    <input id="storeFilter" type="text" placeholder="请输入店铺名关键字">
                </div>
                <div class="form-item">
                    <label for="accountFilter">账号</label>
                    <input id="accountFilter" type="text" placeholder="请输入账号关键字">
                </div>
                <div class="search-inline-actions">
                    <button class="btn btn-primary" id="searchBtn" type="button">搜索</button>
                    <button class="btn btn-outline" id="resetBtn" type="button">重置</button>
                    <button class="btn btn-outline" id="toggleSearchBtn" type="button">更多搜索 ▼</button>
                    <button class="btn btn-outline" id="saveShortcutBtn" type="button">保存快捷键</button>
                </div>
            </div>
            <div class="search-grid collapsed" id="searchGrid">
                <div class="form-item advanced-item">
                    <label for="ownerFilter">负责人</label>
                    <select id="ownerFilter"></select>
                </div>
                <div class="form-item advanced-item">
                    <label for="siteFilter">站点</label>
                    <select id="siteFilter"></select>
                </div>
                <div class="form-item advanced-item">
                    <label for="statusFilter">状态</label>
                    <select id="statusFilter">
                        <option value="">全部状态</option>
                        <option value="正常">正常</option>
                        <option value="预警">预警</option>
                        <option value="异常">异常</option>
                    </select>
                </div>
                <div class="form-item advanced-item">
                    <label for="deptFilter">账号所属部门</label>
                    <select id="deptFilter">
                        <option value="">全部部门</option>
                        <option value="欧洲业务部">欧洲业务部</option>
                        <option value="美区业务部">美区业务部</option>
                        <option value="东南亚业务部">东南亚业务部</option>
                    </select>
                </div>
                <div class="form-item advanced-item">
                    <label for="brandFilter">绑定品牌</label>
                    <select id="brandFilter">
                        <option value="">全部品牌</option>
                        <option value="HomeLab">HomeLab</option>
                        <option value="GlowMix">GlowMix</option>
                        <option value="TripNova">TripNova</option>
                    </select>
                </div>
                <div class="form-item advanced-item">
                    <label for="listGroupFilter">刊登账号组</label>
                    <select id="listGroupFilter">
                        <option value="">全部刊登账号组</option>
                        <option value="刊登A组">刊登A组</option>
                        <option value="刊登B组">刊登B组</option>
                        <option value="刊登C组">刊登C组</option>
                    </select>
                </div>
            </div>
            <div class="search-actions">
                <div class="search-actions-left">
                    <button class="btn btn-outline" id="batchActionBtn" type="button">批量操作</button>
                    <button class="btn btn-outline" id="exportBtn" type="button">导出</button>
                    <button class="btn btn-outline" id="importBtn" type="button">导入</button>
                </div>
                <div class="search-actions-right">
                    <div class="view-switch">
                        <button class="view-btn" id="shopViewBtn" type="button">店铺视图</button>
                        <button class="view-btn active" id="groupViewBtn" type="button">账号组视图</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="table-section">
            <div class="table-toolbar">
                <div class="table-toolbar-left">
                    <div class="table-current-group-label">当前账号组</div>
                    <div class="table-current-group-value" id="currentGroupBar">--</div>
                </div>
                <div class="table-meta" id="tableMeta">共 0 条记录</div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>账号组</th>
                            <th>来源渠道（店铺名）</th>
                            <th>账号</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="pagination-section">
                <div class="page-info">共 <span id="totalCount">0</span> 条记录，当前第 <span id="currentPageDisplay">1</span>/<span id="totalPagesDisplay">1</span> 页</div>
                <div class="page-controls">
                    <select class="page-size-select" id="pageSizeSelect">
                        <option value="10">10 条/页</option>
                        <option value="20" selected>20 条/页</option>
                        <option value="50">50 条/页</option>
                    </select>
                    <button class="page-btn" id="prevPageBtn" type="button">上一页</button>
                    <button class="page-btn" id="nextPageBtn" type="button">下一页</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        const rawData = [
            { id: 1, group: "A组", storeName: "Amazon-US-Home", account: "acct_a_001", owner: "张三", site: "美国站", status: "正常" },
            { id: 2, group: "A组", storeName: "Amazon-UK-Living", account: "acct_a_002", owner: "张三", site: "英国站", status: "正常" },
            { id: 3, group: "A组", storeName: "Amazon-CA-Kitchen", account: "acct_a_003", owner: "李四", site: "加拿大站", status: "预警" },
            { id: 4, group: "A组", storeName: "Amazon-FR-Decor", account: "acct_a_004", owner: "李四", site: "法国站", status: "正常" },
            { id: 5, group: "B组", storeName: "TikTok-US-Beauty", account: "acct_b_001", owner: "王五", site: "美国站", status: "预警" },
            { id: 6, group: "B组", storeName: "TikTok-UK-Skincare", account: "acct_b_002", owner: "王五", site: "英国站", status: "正常" },
            { id: 7, group: "B组", storeName: "TikTok-DE-Lifestyle", account: "acct_b_003", owner: "赵六", site: "德国站", status: "异常" },
            { id: 8, group: "C组", storeName: "Shopee-SG-Fashion", account: "acct_c_001", owner: "张三", site: "新加坡站", status: "正常" },
            { id: 9, group: "C组", storeName: "Shopee-MY-Sports", account: "acct_c_002", owner: "李四", site: "马来站", status: "正常" },
            { id: 10, group: "C组", storeName: "Shopee-TH-Travel", account: "acct_c_003", owner: "赵六", site: "泰国站", status: "预警" },
            { id: 11, group: "C组", storeName: "Shopee-PH-Digital", account: "acct_c_004", owner: "赵六", site: "菲律宾站", status: "正常" },
            { id: 12, group: "C组", storeName: "Shopee-VN-Outlet", account: "acct_c_005", owner: "王五", site: "越南站", status: "异常" }
        ];

        rawData.forEach((item, index) => {
            const deptList = ["美区业务部", "美区业务部", "欧洲业务部", "欧洲业务部", "美区业务部", "欧洲业务部", "欧洲业务部", "东南亚业务部", "东南亚业务部", "东南亚业务部", "东南亚业务部", "东南亚业务部"];
            const brandList = ["HomeLab", "HomeLab", "HomeLab", "GlowMix", "GlowMix", "GlowMix", "GlowMix", "TripNova", "TripNova", "TripNova", "TripNova", "TripNova"];
            const listGroupList = ["刊登A组", "刊登A组", "刊登A组", "刊登A组", "刊登B组", "刊登B组", "刊登B组", "刊登C组", "刊登C组", "刊登C组", "刊登C组", "刊登C组"];
            const vacationModes = ["在售", "非在售", "在售", "在售", "非在售", "在售", "无采集数据", "在售", "非在售", "在售", "在售", "无采集数据"];
            const opModes = ["FBA", "混合", "FBA", "FBM", "混合", "FBA", "-", "FBM", "混合", "FBA", "FBM", "-"];
            const eprDays = [120, 18, 76, 210, 26, 12, -3, 96, 45, 21, 82, -10];
            const infringementList = [0, 0, 1, 0, 0, 2, 0, 0, 0, 1, 0, 0];
            const policyList = [0, 1, 0, 0, 1, 0, 0, 0, 0, 1, 0, 1];
            const noSafetyPicList = [false, false, false, true, false, false, true, false, false, false, false, true];
            item.dept = deptList[index];
            item.brand = brandList[index];
            item.listGroup = listGroupList[index];
            item.vacationMode = vacationModes[index];
            item.opMode = opModes[index];
            item.eprDays = eprDays[index];
            item.infringement = infringementList[index];
            item.policyWarning = policyList[index];
            item.noSafetyPic = noSafetyPicList[index];
        });

        const currentGroupBar = document.getElementById("currentGroupBar");
        const shopViewBtn = document.getElementById("shopViewBtn");
        const groupViewBtn = document.getElementById("groupViewBtn");
        const dashboardSection = document.getElementById("dashboardSection");
        const toggleDashboardBtn = document.getElementById("toggleDashboardBtn");
        const searchGrid = document.getElementById("searchGrid");
        const toggleSearchBtn = document.getElementById("toggleSearchBtn");
        const groupFilter = document.getElementById("groupFilter");
        const storeFilter = document.getElementById("storeFilter");
        const accountFilter = document.getElementById("accountFilter");
        const ownerFilter = document.getElementById("ownerFilter");
        const siteFilter = document.getElementById("siteFilter");
        const statusFilter = document.getElementById("statusFilter");
        const deptFilter = document.getElementById("deptFilter");
        const brandFilter = document.getElementById("brandFilter");
        const listGroupFilter = document.getElementById("listGroupFilter");
        const searchBtn = document.getElementById("searchBtn");
        const resetBtn = document.getElementById("resetBtn");
        const statusChartEl = document.getElementById("statusChart");
        const vacationChartEl = document.getElementById("vacationChart");
        const opModeChartEl = document.getElementById("opModeChart");
        const warningProgressContainer = document.getElementById("warningProgressContainer");
        const tableMeta = document.getElementById("tableMeta");
        const tableBody = document.getElementById("tableBody");
        const tableContainer = document.querySelector(".table-container");
        const totalCount = document.getElementById("totalCount");
        const currentPageDisplay = document.getElementById("currentPageDisplay");
        const totalPagesDisplay = document.getElementById("totalPagesDisplay");
        const pageSizeSelect = document.getElementById("pageSizeSelect");
        const prevPageBtn = document.getElementById("prevPageBtn");
        const nextPageBtn = document.getElementById("nextPageBtn");

        let currentViewMode = "group";
        let currentGroupName = null;
        let filteredData = [...rawData];
        let currentPage = 1;
        let pageSize = 20;
        let ticking = false;
        const charts = {};

        function getGroupCountMap(list) {
            return list.reduce((map, item) => {
                map[item.group] = (map[item.group] || 0) + 1;
                return map;
            }, {});
        }

        function buildOptions() {
            const groups = [...new Set(rawData.map(item => item.group))].sort((a, b) => a.localeCompare(b, "zh-CN"));
            const owners = [...new Set(rawData.map(item => item.owner))].sort((a, b) => a.localeCompare(b, "zh-CN"));
            const sites = [...new Set(rawData.map(item => item.site))].sort((a, b) => a.localeCompare(b, "zh-CN"));

            groupFilter.innerHTML = [`<option value="">全部账号组</option>`, ...groups.map(item => `<option value="${item}">${item}</option>`)].join("");
            ownerFilter.innerHTML = [`<option value="">全部负责人</option>`, ...owners.map(item => `<option value="${item}">${item}</option>`)].join("");
            siteFilter.innerHTML = [`<option value="">全部站点</option>`, ...sites.map(item => `<option value="${item}">${item}</option>`)].join("");
        }

        function applyFilters() {
            const groupValue = groupFilter.value;
            const storeValue = storeFilter.value.trim().toLowerCase();
            const accountValue = accountFilter.value.trim().toLowerCase();
            const ownerValue = ownerFilter.value;
            const siteValue = siteFilter.value;
            const statusValue = statusFilter.value;
            const deptValue = deptFilter.value;
            const brandValue = brandFilter.value;
            const listGroupValue = listGroupFilter.value;

            filteredData = rawData.filter(item => {
                if (groupValue && item.group !== groupValue) return false;
                if (storeValue && !item.storeName.toLowerCase().includes(storeValue)) return false;
                if (accountValue && !item.account.toLowerCase().includes(accountValue)) return false;
                if (ownerValue && item.owner !== ownerValue) return false;
                if (siteValue && item.site !== siteValue) return false;
                if (statusValue && item.status !== statusValue) return false;
                if (deptValue && item.dept !== deptValue) return false;
                if (brandValue && item.brand !== brandValue) return false;
                if (listGroupValue && item.listGroup !== listGroupValue) return false;
                return true;
            });

            currentPage = 1;
            renderPage();
        }

        function resetFilters() {
            groupFilter.value = "";
            storeFilter.value = "";
            accountFilter.value = "";
            ownerFilter.value = "";
            siteFilter.value = "";
            statusFilter.value = "";
            deptFilter.value = "";
            brandFilter.value = "";
            listGroupFilter.value = "";
            filteredData = [...rawData];
            currentPage = 1;
            renderPage();
        }

        function getSortedData() {
            const list = [...filteredData];

            if (currentViewMode === "group") {
                return list.sort((a, b) => {
                    const groupDiff = a.group.localeCompare(b.group, "zh-CN");
                    if (groupDiff !== 0) return groupDiff;
                    return a.storeName.localeCompare(b.storeName, "en");
                });
            }

            return list.sort((a, b) => a.storeName.localeCompare(b.storeName, "en"));
        }

        function renderDashboard() {
            const counts = {
                status: { "正常": 0, "预警": 0, "异常": 0 },
                vacationMode: { "在售": 0, "非在售": 0, "无采集数据": 0 },
                opMode: { "混合": 0, "FBA": 0, "FBM": 0, "未设置": 0 },
                warning: { nearExpiry: 0, expired: 0, infringement: 0, policy: 0, noSafetyPic: 0 }
            };

            filteredData.forEach(item => {
                if (counts.status[item.status] !== undefined) counts.status[item.status] += 1;
                if (counts.vacationMode[item.vacationMode] !== undefined) counts.vacationMode[item.vacationMode] += 1;
                const opModeKey = item.opMode === "-" ? "未设置" : item.opMode;
                if (counts.opMode[opModeKey] !== undefined) counts.opMode[opModeKey] += 1;

                if (item.eprDays >= 0 && item.eprDays <= 30) counts.warning.nearExpiry += 1;
                if (item.eprDays < 0) counts.warning.expired += 1;
                if (item.infringement > 0) counts.warning.infringement += 1;
                if (item.policyWarning > 0) counts.warning.policy += 1;
                if (item.noSafetyPic) counts.warning.noSafetyPic += 1;
            });

            renderCharts(counts);
            renderWarningList(counts.warning);
        }

        function renderCharts(counts) {
            Object.values(charts).forEach(chart => chart && chart.dispose());

            charts.status = echarts.init(statusChartEl);
            charts.status.setOption({
                tooltip: { trigger: "item" },
                legend: { bottom: "0%", left: "center", itemWidth: 10, itemHeight: 10, textStyle: { fontSize: 11 } },
                series: [{
                    type: "pie",
                    radius: ["45%", "75%"],
                    center: ["50%", "42%"],
                    itemStyle: { borderRadius: 4, borderColor: "#fff", borderWidth: 2 },
                    label: { show: false },
                    data: [
                        { value: counts.status["正常"], name: "正常", itemStyle: { color: "#52c41a" } },
                        { value: counts.status["预警"], name: "预警", itemStyle: { color: "#faad14" } },
                        { value: counts.status["异常"], name: "异常", itemStyle: { color: "#ff4d4f" } }
                    ]
                }]
            });

            charts.vacation = echarts.init(vacationChartEl);
            charts.vacation.setOption({
                tooltip: { trigger: "item" },
                legend: { bottom: "0%", left: "center", itemWidth: 10, itemHeight: 10, textStyle: { fontSize: 11 } },
                series: [{
                    type: "pie",
                    radius: "65%",
                    center: ["50%", "42%"],
                    label: { show: false },
                    data: [
                        { value: counts.vacationMode["在售"], name: "在售", itemStyle: { color: "#1890ff" } },
                        { value: counts.vacationMode["非在售"], name: "非在售", itemStyle: { color: "#8c8c8c" } },
                        { value: counts.vacationMode["无采集数据"], name: "无采集数据", itemStyle: { color: "#d9d9d9" } }
                    ]
                }]
            });

            charts.opMode = echarts.init(opModeChartEl);
            charts.opMode.setOption({
                tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
                grid: { left: "3%", right: "4%", bottom: "8%", top: "10%", containLabel: true },
                xAxis: { type: "category", data: ["混合", "FBA", "FBM", "未设置"], axisLabel: { interval: 0, fontSize: 11 } },
                yAxis: { type: "value", splitLine: { lineStyle: { type: "dashed" } } },
                series: [{
                    type: "bar",
                    barWidth: "40%",
                    itemStyle: { color: "#1890ff", borderRadius: [4, 4, 0, 0] },
                    data: [counts.opMode["混合"], counts.opMode["FBA"], counts.opMode["FBM"], counts.opMode["未设置"]]
                }]
            });
        }

        function renderWarningList(warningCounts) {
            const warningConfig = [
                { key: "nearExpiry", name: "近效期预警" },
                { key: "expired", name: "过期预警" },
                { key: "infringement", name: "侵权违规预警" },
                { key: "policy", name: "政策警告预警" },
                { key: "noSafetyPic", name: "安全图片未上传" }
            ];

            const maxCount = Math.max(...warningConfig.map(item => warningCounts[item.key]), 1);
            warningProgressContainer.innerHTML = warningConfig.map(item => {
                const count = warningCounts[item.key];
                const percent = (count / maxCount) * 100;
                return `
                    <div class="progress-item">
                        <span>${item.name}</span>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                        <span>${count}</span>
                    </div>
                `;
            }).join("");
        }

        function renderTable() {
            const data = getSortedData();
            const counts = getGroupCountMap(filteredData);
            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = startIdx + pageSize;
            const pageData = data.slice(startIdx, endIdx);
            let groupIndex = -1;

            tableMeta.textContent = `共 ${data.length} 条记录`;
            totalCount.textContent = String(data.length);

            if (pageData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">暂无符合条件的数据</td></tr>`;
                updatePagination(data.length);
                return;
            }

            tableBody.innerHTML = pageData.map((item, index) => {
                const globalIndex = startIdx + index;
                const prev = data[globalIndex - 1];
                const isGroupStart = currentViewMode === "group" && (!prev || prev.group !== item.group);

                if (isGroupStart) {
                    groupIndex += 1;
                }

                const rowClass = currentViewMode === "group"
                    ? `${isGroupStart ? "group-start " : ""}${groupIndex % 2 === 0 ? "group-even" : "group-odd"}`
                    : "";

                const chipClass = currentViewMode === "group" && isGroupStart
                    ? "group-chip"
                    : "group-chip group-chip-muted";

                return `
                    <tr class="ledger-row ${rowClass}" data-group="${item.group}" data-group-count="${counts[item.group]}">
                        <td><span class="${chipClass}">${item.group}</span></td>
                        <td>${item.storeName}</td>
                        <td>${item.account}</td>
                    </tr>
                `;
            }).join("");

            tableContainer.scrollTop = 0;
            updatePagination(data.length);
        }

        function updatePagination(total) {
            const totalPages = Math.ceil(total / pageSize) || 1;
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }

            currentPageDisplay.textContent = String(currentPage);
            totalPagesDisplay.textContent = String(totalPages);
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= totalPages;
        }

        function setCurrentGroup(groupName) {
            if (!groupName) return;

            const counts = getGroupCountMap(filteredData);
            const groupCount = counts[groupName] || 0;
            currentGroupName = groupName;
            currentGroupBar.textContent = `${groupName}（${groupCount}家店铺）`;
            activeGroupName.textContent = groupName;
            activeGroupStoreCount.textContent = `${groupCount} 家店铺`;
        }

        function updateCurrentGroupByScroll() {
            if (filteredData.length === 0) {
                currentGroupName = null;
                currentGroupBar.textContent = "暂无";
                return;
            }

            const rows = Array.from(document.querySelectorAll(".ledger-row"));
            if (rows.length === 0) return;

            const containerRect = tableContainer.getBoundingClientRect();
            const thead = document.querySelector("thead");
            const headerHeight = thead ? thead.getBoundingClientRect().height : 0;
            const viewportTop = containerRect.top + headerHeight;
            const viewportBottom = containerRect.bottom;
            const visibleRows = rows.filter(row => {
                const rect = row.getBoundingClientRect();
                return rect.bottom > viewportTop && rect.top < viewportBottom;
            });

            const matchedRow = visibleRows.reduce((topRow, currentRow) => {
                if (!topRow) return currentRow;
                return currentRow.getBoundingClientRect().top < topRow.getBoundingClientRect().top
                    ? currentRow
                    : topRow;
            }, null);

            if (matchedRow) {
                setCurrentGroup(matchedRow.dataset.group);
                return;
            }

            if (currentGroupName && filteredData.some(item => item.group === currentGroupName)) {
                setCurrentGroup(currentGroupName);
                return;
            }

            setCurrentGroup(filteredData[0].group);
        }

        function handleScroll() {
            if (ticking) return;

            ticking = true;
            requestAnimationFrame(() => {
                updateCurrentGroupByScroll();
                ticking = false;
            });
        }

        function renderPage() {
            renderDashboard();
            renderTable();
            requestAnimationFrame(updateCurrentGroupByScroll);
        }

        function setViewMode(mode) {
            if (mode === currentViewMode) return;

            currentViewMode = mode;
            currentPage = 1;
            shopViewBtn.classList.toggle("active", mode === "shop");
            groupViewBtn.classList.toggle("active", mode === "group");
            renderPage();
        }

        function changePage(delta) {
            const totalPages = Math.ceil(getSortedData().length / pageSize) || 1;
            const nextPage = currentPage + delta;
            if (nextPage < 1 || nextPage > totalPages) return;
            currentPage = nextPage;
            renderPage();
        }

        function changePageSize() {
            pageSize = Number(pageSizeSelect.value);
            currentPage = 1;
            renderPage();
        }

        function toggleDashboard() {
            dashboardSection.classList.toggle("collapsed");
            toggleDashboardBtn.textContent = dashboardSection.classList.contains("collapsed") ? "展开看板 ▼" : "收起看板 ▲";
        }

        function toggleAdvancedSearch() {
            searchGrid.classList.toggle("collapsed");
            toggleSearchBtn.textContent = searchGrid.classList.contains("collapsed") ? "更多搜索 ▼" : "收起更多搜索 ▲";
        }

        shopViewBtn.addEventListener("click", () => setViewMode("shop"));
        groupViewBtn.addEventListener("click", () => setViewMode("group"));
        toggleDashboardBtn.addEventListener("click", toggleDashboard);
        toggleSearchBtn.addEventListener("click", toggleAdvancedSearch);
        searchBtn.addEventListener("click", applyFilters);
        resetBtn.addEventListener("click", resetFilters);
        pageSizeSelect.addEventListener("change", changePageSize);
        prevPageBtn.addEventListener("click", () => changePage(-1));
        nextPageBtn.addEventListener("click", () => changePage(1));
        tableContainer.addEventListener("scroll", handleScroll, { passive: true });
        window.addEventListener("resize", () => {
            Object.values(charts).forEach(chart => chart && chart.resize());
            handleScroll();
        });

        buildOptions();
        resetFilters();
    </script>
</body>
</html>
