<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预警列表与详情 - 账号台账管理</title>
    <style>
        :root {
            --primary-color: #1890ff;
            --border-color: #e8e8e8;
            --bg-color: #f0f2f5;
            --text-color: #333;
            --text-secondary: #666;
            --warning-bg: #fff7e6;
            --warning-text: #d46b08;
            --warning-border: #ffd591;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            font-size: 14px;
        }

        /* 平铺布局容器 */
        .page-wrapper {
            display: flex;
            gap: 24px;
            max-width: 1600px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .panel {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .left-panel {
            flex: 1.2; /* 左侧列表稍宽 */
            min-width: 0;
        }

        .right-panel {
            flex: 1; /* 右侧详情 */
            min-width: 0;
            position: sticky;
            top: 24px; /* 滚动时固定在顶部 */
        }

        .header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
        }

        /* 主表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border-color);
        }

        .data-table th, .data-table td {
            padding: 16px;
            text-align: left;
            border: 1px solid var(--border-color);
            vertical-align: top;
        }

        .data-table th {
            background-color: #fafafa;
            font-weight: 500;
            color: var(--text-color);
        }

        /* 来源渠道列样式 */
        .channel-cell {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .channel-name {
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-icon {
            color: #52c41a;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.8;
        }
        .copy-icon:hover {
            opacity: 1;
        }

        .warning-block {
            background-color: #fffaf0;
            color: #d46b08;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: fit-content;
            border: 1px solid #ffe58f;
        }

        .warning-item-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .warning-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            background-color: #faad14;
            mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm-32 232c0-4.4 3.6-8 8-8h48c4.4 0 8 3.6 8 8v272c0 4.4-3.6 8-8 8h-48c-4.4 0-8-3.6-8-8V296zm32 440a48.01 48.01 0 0 1 0-96 48.01 48.01 0 0 1 0 96z'/%3E%3C/svg%3E") no-repeat center / contain;
            -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm-32 232c0-4.4 3.6-8 8-8h48c4.4 0 8 3.6 8 8v272c0 4.4-3.6 8-8 8h-48c-4.4 0-8-3.6-8-8V296zm32 440a48.01 48.01 0 0 1 0-96 48.01 48.01 0 0 1 0 96z'/%3E%3C/svg%3E") no-repeat center / contain;
        }

        .btn-detail-small {
            background: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            margin-left: 12px;
            box-shadow: 0 2px 0 rgba(0,0,0,0.015);
            transition: all 0.3s;
        }
        .btn-detail-small:hover, .btn-detail-small.active {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* 右侧详情区域样式 */
        .alert-info {
            background-color: #fffbe6;
            border: 1px solid #ffe58f;
            padding: 12px 16px;
            border-radius: 2px;
            color: #d46b08;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .alert-info ul {
            margin: 0;
            padding-left: 16px;
        }
        .alert-info li {
            margin-bottom: 4px;
        }
        .alert-info li:last-child {
            margin-bottom: 0;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }

        .detail-table td, .detail-table th {
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            text-align: center;
        }
        
        .detail-table td:nth-child(3) {
            text-align: left;
        }

        .detail-table .bg-gray {
            background-color: #fafafa;
            color: #333;
            font-weight: 500;
        }

        .btn-confirm {
            background-color: #fff7e6;
            color: #d46b08;
            border: 1px solid #ffd591;
            padding: 4px 12px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-confirm:hover {
            background-color: #ffd591;
            color: #fff;
        }

        .empty-text {
            text-align: center;
            color: #999;
            padding: 60px 0;
            font-size: 14px;
        }
        
        .active-row {
            background-color: #e6f7ff !important;
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <!-- 左侧：账号列表 -->
    <div class="panel left-panel">
        <div class="header">
            <h2>账号列表</h2>
        </div>
        <table class="data-table" id="mainTable">
            <thead>
                <tr>
                    <th width="40%">来源渠道</th>
                    <th width="20%">账号状态</th>
                    <th width="20%">负责人</th>
                    <th width="20%">操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- 表格内容由JS动态生成 -->
            </tbody>
        </table>
    </div>

    <!-- 右侧：预警详情 -->
    <div class="panel right-panel">
        <div class="header">
            <h2>预警详情</h2>
        </div>
        <div id="detailContent">
            <!-- 详情内容由JS动态生成 -->
            <div class="empty-text">请在左侧列表中点击“详情”查看具体预警信息</div>
        </div>
    </div>
</div>

<script>
    // 模拟数据
    let warningsData = [
        // 1. Amazon-Z011665-AU (3条预警)
        {
            id: 1,
            channel: 'Amazon-Z011665-AU',
            type: 'FBMM业务员设置错误',
            time: '2025-12-11 12:45:20',
            content: '当前FBMM业务员：张三<br>当前业务员部门：亚马逊平台运营中心<br>要求部门：智能研发中心'
        },
        {
            id: 2,
            channel: 'Amazon-Z011665-AU',
            type: 'EPR近效期预警',
            time: '2026-04-10 08:30:00',
            content: 'EPR类型=德国包装法，有效期2026-05-20 剩余12天'
        },
        {
            id: 3,
            channel: 'Amazon-Z011665-AU',
            type: '欧代过期预警',
            time: '2026-04-12 14:20:00',
            content: '当前欧代有效期2025-11-15 已过期46天'
        },
        
        // 2. Amazon-Z011666-DE (2条预警)
        {
            id: 4,
            channel: 'Amazon-Z011666-DE',
            type: 'EPR近效期预警',
            time: '2026-04-11 11:20:00',
            content: 'EPR类型=德国WEEE，有效期2026-05-25 剩余17天'
        },
        {
            id: 5,
            channel: 'Amazon-Z011666-DE',
            type: '欧代近效期预警',
            time: '2026-04-09 09:15:00',
            content: '当前欧代有效期2026-05-05 剩余20天'
        },

        // 3. Amazon-Z011667-FR (1条预警)
        {
            id: 6,
            channel: 'Amazon-Z011667-FR',
            type: 'EPR过期预警',
            time: '2026-04-08 14:10:00',
            content: 'EPR类型=法国电气法，有效期2025-12-01 已过期30天'
        }
    ];

    let currentSelectedChannel = null;

    // 按时间倒序排序
    function sortWarnings(data) {
        return data.sort((a, b) => new Date(b.time) - new Date(a.time));
    }

    // 分组数据
    function groupDataByChannel(data) {
        const grouped = {};
        const allChannels = ['Amazon-Z011665-AU', 'Amazon-Z011666-DE', 'Amazon-Z011667-FR'];
        allChannels.forEach(ch => grouped[ch] = []);

        data.forEach(item => {
            if (!grouped[item.channel]) {
                grouped[item.channel] = [];
            }
            grouped[item.channel].push(item);
        });
        
        for (let channel in grouped) {
            grouped[channel] = sortWarnings(grouped[channel]);
        }
        return grouped;
    }

    // 渲染左侧主表格
    function renderMainTable() {
        const tbody = document.querySelector('#mainTable tbody');
        tbody.innerHTML = '';

        const groupedData = groupDataByChannel(warningsData);

        for (let channel in groupedData) {
            const channelWarnings = groupedData[channel];
            const totalCount = channelWarnings.length;
            const displayCount = Math.min(totalCount, 2);
            const hasMore = totalCount > 2;
            const isActive = currentSelectedChannel === channel;

            const tr = document.createElement('tr');
            if (isActive) {
                tr.className = 'active-row';
            }
            
            let channelHtml = `
                <div class="channel-cell">
                    <div class="channel-name">
                        ${channel} 
                        <svg class="copy-icon" viewBox="64 64 896 896" width="1em" height="1em" fill="currentColor">
                            <path d="M832 64H296c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h496v688c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8V96c0-17.7-14.3-32-32-32zM704 192H192c-17.7 0-32 14.3-32 32v530.7c0 8.5 3.4 16.6 9.4 22.6l173.3 173.3c6 6 14.1 9.4 22.6 9.4H704c17.7 0 32-14.3 32-32V224c0-17.7-14.3-32-32-32zM382.6 896l-132-132V264h422.7v632H382.6z"></path>
                        </svg>
                    </div>
            `;
            
            if (displayCount > 0) {
                channelHtml += `\n                    <div class="warning-block">\n`;
                for (let i = 0; i < displayCount; i++) {
                    const isLastDisplayed = (i === displayCount - 1);
                    const showDetailBtn = isLastDisplayed && totalCount > 0;
                    
                    let btnText = '详情';
                    if (totalCount > 2) {
                        btnText = `详情 +${totalCount - 2}`;
                    }
                    
                    channelHtml += `
                        <div class="warning-item-row">
                            <i class="warning-icon"></i> <span>${channelWarnings[i].type}</span>
                            ${showDetailBtn ? `<button class="btn-detail-small ${isActive ? 'active' : ''}" onclick="showDetail('${channel}')">${btnText}</button>` : ''}
                        </div>
                    `;
                }
                channelHtml += `                    </div>\n`;
            }
            
            channelHtml += `
                </div>
            `;

            tr.innerHTML = `
                <td>${channelHtml}</td>
                <td>正常</td>
                <td>张三</td>
                <td><a href="javascript:void(0)" style="color:var(--primary-color);text-decoration:none;">编辑</a></td>
            `;
            
            tbody.appendChild(tr);
        }
    }

    // 确认（消除）预警
    function confirmWarning(id) {
        if(confirm('确定要消除该条预警吗？')) {
            warningsData = warningsData.filter(item => item.id !== id);
            
            // 重新渲染主表格
            renderMainTable();
            
            // 刷新右侧详情区域
            if (currentSelectedChannel) {
                renderDetailPanel(currentSelectedChannel);
            }
        }
    }

    // 在右侧展示详情
    function showDetail(channel) {
        currentSelectedChannel = channel;
        renderMainTable(); // 重新渲染以更新高亮状态
        renderDetailPanel(channel);
    }

    // 渲染右侧详情面板
    function renderDetailPanel(channel) {
        const detailContent = document.getElementById('detailContent');
        const channelWarnings = warningsData.filter(item => item.channel === channel);
        const sortedWarnings = sortWarnings(channelWarnings);

        if (sortedWarnings.length === 0) {
            detailContent.innerHTML = `
                <div class="empty-text">该渠道暂无预警数据</div>
            `;
            return;
        }

        let html = `
            <div class="alert-info">
                <ul>
                    <li>系统每天定时执行检查账号配置</li>
                    <li>定时检测到问题已修复后自动消除预警，支持点击已确认手动消除</li>
                </ul>
            </div>
            
            <table class="detail-table">
                <tbody>
                    <tr>
                        <td class="bg-gray" width="20%">来源渠道</td>
                        <td colspan="3">${channel}</td>
                    </tr>
                    <tr>
                        <td class="bg-gray" width="20%">预警类型</td>
                        <td class="bg-gray" width="25%">预警时间</td>
                        <td class="bg-gray" width="40%">预警内容</td>
                        <td class="bg-gray" width="15%">操作</td>
                    </tr>
        `;

        sortedWarnings.forEach(warning => {
            html += `
                <tr>
                    <td>${warning.type}</td>
                    <td>${warning.time}</td>
                    <td>${warning.content}</td>
                    <td>
                        <button class="btn-confirm" onclick="confirmWarning(${warning.id})">已确认</button>
                    </td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>
        `;

        detailContent.innerHTML = html;
    }

    // 初始化渲染
    renderMainTable();
</script>

</body>
</html>
