<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号台账管理 - 预警监控看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #1890ff;
            --primary-hover: #40a9ff;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-secondary: #666666;
            --border-color: #e8e8e8;
            --danger-color: #ff4d4f;
            --warning-color: #faad14;
            --success-color: #52c41a;
            --shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            --border-radius: 6px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
        }

        /* ================= 顶部栏 ================= */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: -6px;
        }

        /* ================= 看板区域 (极简压缩版) ================= */
        .dashboard-section {
            display: flex;
            flex-direction: column;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
            max-height: 1000px;
            opacity: 1;
            overflow: hidden;
        }

        .dashboard-section.collapsed {
            max-height: 0;
            opacity: 0;
            margin: 0;
            pointer-events: none;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .card-group {
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .card-group-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        /* 预警进度条 */
        .progress-list-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            height: 110px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .progress-list-container::-webkit-scrollbar { width: 4px; }
        .progress-list-container::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 4px; }
        .progress-item {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .progress-item:hover { background-color: #fff2f0; }
        .progress-item.active { background-color: #fff2f0; border-color: var(--danger-color); }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 2px;
            color: var(--text-secondary);
        }
        .progress-item.active .progress-info { color: var(--danger-color); font-weight: bold; }
        .progress-track { height: 4px; background-color: #f5f5f5; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--danger-color); border-radius: 2px; transition: width 0.5s ease; }

        /* ================= 搜索面板 ================= */
        .search-panel {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .search-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: flex-end;
        }

        .search-grid.collapsed .advanced-item { display: none; }

        .form-item { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            width: 190px;
            flex-grow: 1;
            max-width: 280px; 
        }
        .form-item label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        .form-item input, .form-item select {
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            width: 100%;
            height: 28px;
        }
        .form-item input:focus, .form-item select:focus { border-color: var(--primary-color); }
        
        .range-group { display: flex; align-items: center; gap: 4px; }
        .range-group input { flex: 1; min-width: 0; }
        
        .search-actions-inline {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            min-width: 280px;
            height: 28px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
        }
        .action-left { display: flex; gap: 8px; }
        .action-right { display: flex; gap: 8px; }

        .btn {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-primary { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .btn-primary:hover { background-color: var(--primary-hover); border-color: var(--primary-hover); }
        .btn-link { background: transparent; border: none; color: var(--primary-color); cursor: pointer; font-size: 12px; }
        .btn-link:hover { text-decoration: underline; }

        .active-filter-tag {
            display: inline-flex; align-items: center; background: #e6f7ff; color: var(--primary-color);
            padding: 2px 10px; border-radius: 12px; font-size: 12px; border: 1px solid #91d5ff;
        }
        .active-filter-tag span { cursor: pointer; margin-left: 6px; font-weight: bold; }

        /* ================= 复杂表格区域 ================= */
        .table-section {
            flex: 1;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .table-container {
            flex: 1;
            overflow: auto;
        }

        .complex-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            table-layout: fixed;
            min-width: 1800px;
        }

        .complex-table th, .complex-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            vertical-align: top;
            word-wrap: break-word;
        }

        .complex-table th {
            background-color: #fafafa;
            color: var(--text-secondary);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .complex-table tbody tr:hover td { background-color: #fafafa; }

        /* 表格内部信息排版 */
        .info-row { display: flex; margin-bottom: 3px; line-height: 1.4; }
        .info-label { color: var(--text-secondary); width: 75px; flex-shrink: 0; }
        .info-value { color: var(--text-main); flex: 1; }
        
        .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        
        .icon-success { color: var(--success-color); width: 14px; height: 14px; }
        .icon-error { color: var(--danger-color); width: 14px; height: 14px; }

        .status-tag {
            display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; border: 1px solid transparent;
        }
        .tag-normal { background: #e6f7ff; color: var(--primary-color); border-color: #91d5ff; }
        .tag-error { background: #fff2f0; color: var(--danger-color); border-color: #ffccc7; }

        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .drawer-content {
            position: absolute;
            top: 0; right: -400px;
            width: 400px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .drawer-overlay.active .drawer-content {
            right: 0;
        }
        .drawer-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-body {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .drawer-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        .drawer-body .form-item {
            width: 100%;
            max-width: none;
            flex-direction: row;
            align-items: center;
        }
        .drawer-body .form-item label {
            width: 120px;
            flex-shrink: 0;
            text-align: right;
            padding-right: 12px;
        }
        .drawer-body .form-item input, .drawer-body .form-item select, .drawer-body .range-group {
            flex: 1;
        }

        /* 分页 */
        .pagination-section {
            padding: 8px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .page-controls { display: flex; align-items: center; gap: 8px; }
        .page-controls select { padding: 2px 4px; border: 1px solid var(--border-color); border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div style="font-size: 14px; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 6px;">
            <div style="width: 3px; height: 14px; background: var(--primary-color); border-radius: 2px;"></div>
            数据看板
        </div>
        <button class="btn" id="toggleDashboardBtn" onclick="toggleDashboard()">
            收起看板 ▲
        </button>
    </div>

    <!-- 看板区域 -->
    <div class="dashboard-section" id="dashboardSection">
        <div class="dashboard-grid">
            <div class="card-group"><div class="card-group-title">店铺状态</div><div id="statusChart" style="width: 100%; height: 110px;"></div></div>
            <div class="card-group"><div class="card-group-title">休假模式</div><div id="vacationChart" style="width: 100%; height: 110px;"></div></div>
            <div class="card-group"><div class="card-group-title">运营模式</div><div id="opModeChart" style="width: 100%; height: 110px;"></div></div>
            <div class="card-group warning-group"><div class="card-group-title">预警类</div><div id="warningProgressContainer" class="progress-list-container"></div></div>
        </div>
    </div>

    <!-- 搜索面板 -->
    <div class="search-panel">
        <div class="search-grid collapsed" id="searchGrid">
            <div class="form-item"><label>账号组</label><select id="s_group"><option value="">全部</option><option value="A组">A组</option></select></div>
            <div class="form-item"><label>真实店铺名</label><input type="text" id="s_storeName" placeholder="请输入"></div>
            <div class="form-item"><label>店铺状态</label><select id="s_storeStatus"><option value="">全部</option><option value="正常">正常</option><option value="失败">失败</option></select></div>
            <div class="form-item"><label>休假模式</label><select id="s_vacation"><option value="">全部</option><option value="在售">在售</option><option value="非在售(主动)">非在售(主动)</option><option value="非在售(待确认)">非在售(待确认)</option><option value="异常数据">异常数据</option><option value="无采集数据">无采集数据</option></select></div>
            <div class="form-item"><label>运营模式</label><select id="s_opMode"><option value="">全部</option><option value="FBA">FBA</option></select></div>
            <div class="form-item"><label>近30天销量</label><div class="range-group"><input type="number" placeholder="最小"><span>-</span><input type="number" placeholder="最大"></div></div>
            <div class="form-item advanced-item"><label>来源渠道</label><select><option value="">全部</option></select></div>
            <div class="form-item advanced-item"><label>邮箱激活状态</label><select><option value="">全部</option></select></div>
            <div class="form-item advanced-item"><label>API授权状态</label><select><option value="">全部</option></select></div>
            <div class="form-item advanced-item"><label>发货单激活状态</label><select><option value="">全部</option></select></div>
            <div class="form-item advanced-item"><label>品牌授权时间</label><div class="range-group"><input type="date"><span>-</span><input type="date"></div></div>
            <div class="form-item advanced-item"><label>FBA在线链接数</label><div class="range-group"><input type="number" placeholder="最小"><span>-</span><input type="number" placeholder="最大"></div></div>
            
            <!-- 搜索操作按钮跟随在最后 -->
            <div class="search-actions-inline">
                <div id="activeFilterDisplay" style="display: none; margin-right: auto;"></div>
                <button class="btn btn-primary" onclick="handleSearch()">查询</button>
                <button class="btn" onclick="resetSearch()">重置</button>
                <button class="btn" id="moreSearchBtn" onclick="openDrawer()" style="display: none;">更多搜索</button>
            </div>
        </div>

        <!-- 数据操作栏 -->
        <div class="action-bar">
            <div class="action-left">
                <button class="btn btn-primary" style="display: flex; align-items: center; gap: 4px;">批量操作 <i data-lucide="chevron-down" style="width: 14px; height: 14px;"></i></button>
                <button class="btn" style="display: flex; align-items: center; gap: 4px;">导出 <i data-lucide="chevron-down" style="width: 14px; height: 14px;"></i></button>
                <button class="btn" style="display: flex; align-items: center; gap: 4px;">导入 <i data-lucide="chevron-down" style="width: 14px; height: 14px;"></i></button>
            </div>
            <div class="action-right">
                <button class="btn" style="padding: 4px 6px;"><i data-lucide="filter" style="width: 14px; height: 14px;"></i></button>
                <button class="btn" style="padding: 4px 6px;"><i data-lucide="settings" style="width: 14px; height: 14px;"></i></button>
            </div>
        </div>
    </div>

    <!-- 复杂表格区域 -->
    <div class="table-section">
        <div class="table-container">
            <table class="complex-table">
                <colgroup>
                    <col style="width: 40px;">
                    <col style="width: 140px;">
                    <col style="width: 260px;">
                    <col style="width: 240px;">
                    <col style="width: 80px;">
                    <col style="width: 100px;">
                    <col style="width: 80px;">
                    <col style="width: 200px;">
                    <col style="width: 260px;">
                    <col style="width: 160px;">
                    <col style="width: 100px;">
                    <col style="width: 80px;">
                </colgroup>
                <thead>
                    <tr>
                        <th style="text-align: center;"><input type="checkbox"></th>
                        <th>来源渠道</th>
                        <th>品牌/人发</th>
                        <th>店铺基本信息</th>
                        <th>备注</th>
                        <th>VAT税号</th>
                        <th>EPR</th>
                        <th>欧代</th>
                        <th>销售权限</th>
                        <th>状态</th>
                        <th>运营模式</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 数据由JS渲染 -->
                </tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="pagination-section">
            <div><input type="checkbox" class="mr-1">全选</div>
            <div class="page-controls">
                <span>共 <span id="totalCount">0</span> 条</span>
                <select><option>10 条/页</option></select>
                <button class="btn" style="padding: 2px 6px;">&lt;</button>
                <button class="btn btn-primary" style="padding: 2px 8px;">1</button>
                <button class="btn" style="padding: 2px 8px;">2</button>
                <button class="btn" style="padding: 2px 6px;">&gt;</button>
            </div>
        </div>
    </div>
</div>

<!-- 更多搜索抽屉 -->
<div class="drawer-overlay" id="searchDrawer" onclick="closeDrawer()">
    <div class="drawer-content" onclick="event.stopPropagation()">
        <div class="drawer-header">
            <div style="font-size: 14px; font-weight: bold;">更多搜索</div>
            <button class="btn-link" onclick="closeDrawer()" style="color: var(--text-secondary);"><i data-lucide="x" style="width: 16px; height: 16px;"></i></button>
        </div>
        <div class="drawer-body" id="drawerBody">
            <!-- 高级搜索条件将被移入这里 -->
        </div>
        <div class="drawer-footer">
            <button class="btn btn-primary" onclick="handleSearch(); closeDrawer();">搜索</button>
            <button class="btn" onclick="resetSearch()">重置</button>
        </div>
    </div>
</div>

    let currentData = [...mockData];

    let charts = {};

    function getDaysDiff(dateStr) { return Math.ceil((new Date(dateStr) - SYSTEM_DATE) / (1000 * 60 * 60 * 24)); }

    function initDashboard() {
        const counts = {
            status: { '正常': 0, '失败': 0, '未处理': 0, '支付方式无效': 0 },
            vacationMode: { '在售': 0, '非在售(主动)': 0, '非在售(待确认)': 0, '异常数据': 0, '无采集数据': 0 },
            opMode: { '混合': 0, 'FBA': 0, 'FBM': 0, '-': 0 },
            warning: { nearExpiry: 0, expired: 0, infringement: 0, prohibited: 0, policy: 0, fbmError: 0, noSafetyPic: 0 }
        };

        mockData.forEach(item => {
            if(counts.status[item.status] !== undefined) counts.status[item.status]++;
            if(counts.vacationMode[item.vacationMode] !== undefined) counts.vacationMode[item.vacationMode]++;
            if(counts.opMode[item.opMode] !== undefined) counts.opMode[item.opMode]++;
            const diff = getDaysDiff(item.eprExpiry);
            if (diff >= 0 && diff <= 30) counts.warning.nearExpiry++;
            if (diff < 0) counts.warning.expired++;
            if (item.infringement > 0) counts.warning.infringement++;
            if (item.prohibited > 0) counts.warning.prohibited++;
            if (item.policyWarning > 0) counts.warning.policy++;
            if (item.fbmError) counts.warning.fbmError++;
            if (item.noSafetyPic) counts.warning.noSafetyPic++;
        });

        renderCharts(counts);
    }

    function renderCharts(counts) {
        Object.values(charts).forEach(c => c && c.dispose());

        charts.status = echarts.init(document.getElementById('statusChart'));
        charts.status.setOption({

                    { value: counts.status['失败'], name: '失败', itemStyle: { color: '#ff4d4f' } },
                    { value: counts.status['未处理'], name: '未处理', itemStyle: { color: '#faad14' } },
                    { value: counts.status['支付方式无效'], name: '支付方式无效', itemStyle: { color: '#d9d9d9' } }

            }]
        });
        charts.status.on('click', p => applyFilter('status', p.name, p.name + '店铺'));

        charts.vacation = echarts.init(document.getElementById('vacationChart'));
        charts.vacation.setOption({
            tooltip: { trigger: 'item' }, legend: { type: 'scroll', bottom: '0%', left: 'center', itemWidth: 8, itemHeight: 8, textStyle: {fontSize: 10} },
            series: [{ type: 'pie', radius: ['45%', '75%'], center: ['50%', '42%'], itemStyle: { borderRadius: 4, borderColor: '#fff', borderWidth: 2 }, label: { show: false },

                    { value: counts.vacationMode['异常数据'], name: '异常数据', itemStyle: { color: '#ff4d4f' } },
                    { value: counts.vacationMode['无采集数据'], name: '无采集数据', itemStyle: { color: '#bfbfbf' } }
                ]
            }]
        });
        charts.vacation.on('click', p => applyFilter('vacationMode', p.name, p.name + '店铺'));

        charts.opMode = echarts.init(document.getElementById('opModeChart'));
        charts.opMode.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } }, grid: { left: '3%', right: '4%', bottom: '0%', top: '10%', containLabel: true },
            xAxis: { type: 'category', data: ['混合', 'FBA', 'FBM', '未设置'], axisLabel: { interval: 0, fontSize: 10 } }, yAxis: { type: 'value', splitLine: { lineStyle: { type: 'dashed' } } },
            series: [{ type: 'bar', barWidth: '40%', itemStyle: { borderRadius: [4, 4, 0, 0], color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: '#40a9ff'}, {offset: 1, color: '#1890ff'}]) }, data: [counts.opMode['混合'], counts.opMode['FBA'], counts.opMode['FBM'], counts.opMode['-']] }]
        });
        charts.opMode.on('click', p => applyFilter('opMode', p.name === '未设置' ? '-' : p.name, p.name + '模式'));

        const wCont = document.getElementById('warningProgressContainer');
        const wConf = [ { k: 'nearExpiry', n: '近效期预警' }, { k: 'expired', n: '过期预警' }, { k: 'infringement', n: '侵权违规' }, { k: 'prohibited', n: '禁售违规' }, { k: 'policy', n: '政策警告' }, { k: 'fbmError', n: 'FBM设置错误' }, { k: 'noSafetyPic', n: '无安全图' } ];
        const maxW = Math.max(...wConf.map(c => counts.warning[c.k]), 1);
        wCont.innerHTML = wConf.map(c => {
            const v = counts.warning[c.k]; const p = (v / maxW) * 100;
            return `<div class="progress-item" id="pw-${c.k}" onclick="applyFilter('warning','${c.k}','${c.n}')"><div class="progress-info"><span>${c.n}</span><span>${v}</span></div><div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div></div>`;
        }).join('');

        window.addEventListener('resize', () => Object.values(charts).forEach(c => c && c.resize()));
    }

    function applyFilter(type, value, name) {
        if (activeFilterType === type && activeFilterValue === value) { clearFilter(); } 
        else {
            activeFilterType = type; activeFilterValue = value; activeFilterName = name;
            const tag = document.getElementById('activeFilterDisplay');
            tag.style.display = 'inline-flex';
            tag.innerHTML = `<div class="active-filter-tag">筛选: ${name}<span onclick="clearFilter();">×</span></div>`;
            updateActiveState(); executeFilter();
        }
    }
    function clearFilter() {
        activeFilterType = null; activeFilterValue = null; activeFilterName = null;
        document.getElementById('activeFilterDisplay').style.display = 'none';
        updateActiveState(); executeFilter();
    }
    function updateActiveState() {
        document.querySelectorAll('.progress-item').forEach(el => el.classList.remove('active'));
        if (activeFilterType === 'warning') document.getElementById(`pw-${activeFilterValue}`)?.classList.add('active');

    function openDrawer() {
        document.getElementById('searchDrawer').classList.add('active');
    }

    function closeDrawer() {
        document.getElementById('searchDrawer').classList.remove('active');
    }

    function toggleDashboard() {
        const dash = document.getElementById('dashboardSection');
        dash.classList.toggle('collapsed');
        const isDashCollapsed = dash.classList.contains('collapsed');
        document.getElementById('toggleDashboardBtn').innerHTML = isDashCollapsed ? '展开看板 ▼' : '收起看板 ▲';
        
        // 联动：收起看板时，筛选条件展开显示全部（2行）；展开看板时，筛选条件收起展示1行
        const searchGrid = document.getElementById('searchGrid');
        const drawerBody = document.getElementById('drawerBody');
        const moreSearchBtn = document.getElementById('moreSearchBtn');
        const actionsInline = document.querySelector('.search-actions-inline');
        
        if (isDashCollapsed) {
            // 看板收起，高级搜索条件移回主面板
            searchGrid.classList.remove('collapsed');
            moreSearchBtn.style.display = 'none';
            
            // 将所有在抽屉里的高级条件移回
            const advancedItems = Array.from(drawerBody.querySelectorAll('.advanced-item'));
            advancedItems.forEach(item => {
                searchGrid.insertBefore(item, actionsInline);
            });
            closeDrawer();
        } else {
            // 看板展开，高级搜索条件移入抽屉
            searchGrid.classList.add('collapsed');
            moreSearchBtn.style.display = 'inline-block';
            
            // 将主面板里的高级条件移入抽屉
            const advancedItems = Array.from(searchGrid.querySelectorAll('.advanced-item'));
            advancedItems.forEach(item => {
                drawerBody.appendChild(item);
            });
        }
    }

    function executeFilter() {
        // 简化版过滤，主要演示看板联动
        currentData = mockData.filter(item => {
            if (activeFilterType === 'status' && item.status !== activeFilterValue) return false;
            if (activeFilterType === 'vacationMode' && item.vacationMode !== activeFilterValue) return false;
            if (activeFilterType === 'opMode' && item.opMode !== activeFilterValue) return false;
            if (activeFilterType === 'warning') {
                const d = getDaysDiff(item.eprExpiry);
                switch(activeFilterValue) {
                    case 'nearExpiry': if (!(d >= 0 && d <= 30)) return false; break;
                    case 'expired': if (!(d < 0)) return false; break;
                    case 'infringement': if (item.infringement <= 0) return false; break;
                    case 'prohibited': if (item.prohibited <= 0) return false; break;
                    case 'policy': if (item.policyWarning <= 0) return false; break;
                    case 'fbmError': if (!item.fbmError) return false; break;
                    case 'noSafetyPic': if (!item.noSafetyPic) return false; break;
                }
            }
            return true;
        });
        renderTable();
    }
    
    function handleSearch() { executeFilter(); }
    function resetSearch() { 
        document.querySelectorAll('.search-grid input, .search-grid select, .drawer-body input, .drawer-body select').forEach(el => el.value = ''); 
        clearFilter(); 
    }

    function initDashboardState() {
        const isDashCollapsed = document.getElementById('dashboardSection').classList.contains('collapsed');
        const searchGrid = document.getElementById('searchGrid');
        const drawerBody = document.getElementById('drawerBody');
        const moreSearchBtn = document.getElementById('moreSearchBtn');
        
        if (!isDashCollapsed) {
            searchGrid.classList.add('collapsed');
            moreSearchBtn.style.display = 'inline-block';
            const advancedItems = Array.from(searchGrid.querySelectorAll('.advanced-item'));
            advancedItems.forEach(item => drawerBody.appendChild(item));
        }
    }

    window.onload = () => { initDashboard(); renderTable(); initDashboardState(); };
